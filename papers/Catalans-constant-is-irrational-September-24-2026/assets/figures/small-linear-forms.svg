<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 560" width="1000" height="560" font-family="Helvetica, Arial, sans-serif">
  <title>Small but nonzero integer linear forms</title>
  <desc>Log-scale plot of |A x - B| for integer pairs (A, B). For e, A = n! gives values between 0 and 1/n. For zeta(3), Apery's forms 2 lcm(1..n)^3 (b_n zeta(3) - a_n) shrink like 0.59^n. If x were a/b, every nonzero value would be at least 1/b.</desc>
  <rect x="0" y="0" width="1000" height="560" fill="#ffffff"/>
  <text x="70" y="38" font-size="22" font-weight="bold" fill="#111827">The irrationality test: integer combinations A·x − B that are small but never zero</text>
  <text x="70" y="62" font-size="14" fill="#374151">If x = a/b, then A·x − B = (Aa − Bb)/b is 0 or at least 1/b in size. A sequence of nonzero values sinking below every 1/b</text>
  <text x="70" y="80" font-size="14" fill="#374151">proves x is irrational. Both sequences below were computed with exact integers and 200-digit arithmetic.</text>
