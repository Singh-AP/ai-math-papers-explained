  <text x="551.5" y="137.2" font-size="14" fill="#059669">e (Fourier): n!·e − (integer), between 0 and 1/n</text>
  <text x="131.0" y="361.0" font-size="14" fill="#2563eb">ζ(3) (Apéry): 2·lcm(1,…,n)³·(b_n ζ(3) − a_n)</text>
  <text x="131.0" y="386.3" font-size="14" fill="#2563eb">shrinks on average like 0.59ⁿ, because (√2 − 1)⁴·e³ ≈ 0.59 &lt; 1</text>
  <text x="131.0" y="411.6" font-size="13" fill="#374151">(the zigzag comes from lcm(1,…,n), which jumps at prime powers)</text>
  <text x="520.0" y="548" font-size="13" fill="#374151" text-anchor="middle">For Catalan's constant, the known Apéry-like forms do not tend to zero after their denominators are cleared (Zudilin 2003, cited by the paper).</text>
