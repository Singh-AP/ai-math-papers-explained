<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 560" width="1000" height="560" font-family="Helvetica, Arial, sans-serif">
  <title>The squeeze on the normalized size of the determinant</title>
  <desc>Number line for L_N = log|Delta_N|/(48N)^2 - (1/2) log 2. If G were rational, arithmetic forces L_N &gt;= -2.290810 in the limit. Analysis always gives L_N &lt;= -2.290939875 in the limit. The gap is about 0.00013. Green dots: the true values for small N computed for this explainer.</desc>
  <rect x="0" y="0" width="1000" height="560" fill="#ffffff"/>
  <text x="50" y="38" font-size="22" font-weight="bold" fill="#111827">The squeeze: one number, two incompatible bounds</text>
  <text x="50" y="62" font-size="14" fill="#374151">The paper measures the determinant Δ_N (an n × n matrix with n = 48N) by L_N = log|Δ_N| / n² − ½ log 2.</text>
  <text x="50" y="80" font-size="14" fill="#374151">Both bounds are statements about the limit N → ∞ (the arithmetic one along prime N).</text>
  <rect x="50" y="208" width="439.0" height="54" fill="#dbeafe"/>
  <text x="479.0" y="230" font-size="14" fill="#2563eb" font-weight="bold" text-anchor="end">analysis (always true):</text>
  <text x="479.0" y="250" font-size="14" fill="#2563eb" text-anchor="end">in the limit, L_N ≤ −2.290939875</text>
  <rect x="489.9" y="136" width="450.1" height="54" fill="#fde68a" opacity="0.8"/>
  <text x="499.9" y="158" font-size="14" fill="#92400e" font-weight="bold">arithmetic (only if G were a fraction):</text>
  <text x="499.9" y="178" font-size="14" fill="#92400e">in the limit, L_N ≥ −8609/4608 − (2809/4608)·log 2 ≈ −2.29081</text>
  <line x1="489.0" y1="130" x2="489.0" y2="278" stroke="#2563eb" stroke-width="2.5"/>
  <line x1="489.9" y1="130" x2="489.9" y2="278" stroke="#d97706" stroke-width="2.5"/>
  <line x1="50" y1="270" x2="940" y2="270" stroke="#111827" stroke-width="2"/>
  <polygon points="950,270 938,264 938,276" fill="#111827"/>
  <line x1="113.6" y1="264" x2="113.6" y2="276" stroke="#111827" stroke-width="1.5"/>
  <text x="113.6" y="296" font-size="13" fill="#111827" text-anchor="middle">−2.35</text>
  <line x1="240.7" y1="264" x2="240.7" y2="276" stroke="#111827" stroke-width="1.5"/>
  <text x="240.7" y="296" font-size="13" fill="#111827" text-anchor="middle">−2.33</text>
  <line x1="367.9" y1="264" x2="367.9" y2="276" stroke="#111827" stroke-width="1.5"/>
  <text x="367.9" y="296" font-size="13" fill="#111827" text-anchor="middle">−2.31</text>
  <line x1="495.0" y1="264" x2="495.0" y2="276" stroke="#111827" stroke-width="1.5"/>
  <text x="495.0" y="296" font-size="13" fill="#111827" text-anchor="middle">−2.29</text>
  <line x1="622.1" y1="264" x2="622.1" y2="276" stroke="#111827" stroke-width="1.5"/>
  <text x="622.1" y="296" font-size="13" fill="#111827" text-anchor="middle">−2.27</text>
  <line x1="749.3" y1="264" x2="749.3" y2="276" stroke="#111827" stroke-width="1.5"/>
  <text x="749.3" y="296" font-size="13" fill="#111827" text-anchor="middle">−2.25</text>
  <line x1="876.4" y1="264" x2="876.4" y2="276" stroke="#111827" stroke-width="1.5"/>
  <text x="876.4" y="296" font-size="13" fill="#111827" text-anchor="middle">−2.23</text>
  <text x="50" y="318" font-size="13" fill="#374151">← smaller |Δ_N|</text>
  <text x="940" y="318" font-size="13" fill="#374151" text-anchor="end">larger |Δ_N| →</text>
  <circle cx="840.6" cy="270" r="7" fill="#059669" stroke="#ffffff" stroke-width="1.5"/>
  <text x="840.6" y="238" font-size="13" fill="#059669" text-anchor="middle" font-weight="bold">N=1</text>
  <circle cx="633.6" cy="270" r="7" fill="#059669" stroke="#ffffff" stroke-width="1.5"/>
  <text x="633.6" y="256" font-size="13" fill="#059669" text-anchor="middle" font-weight="bold">N=2</text>
  <circle cx="568.3" cy="270" r="7" fill="#059669" stroke="#ffffff" stroke-width="1.5"/>
  <text x="568.3" y="238" font-size="13" fill="#059669" text-anchor="middle" font-weight="bold">N=3</text>
  <circle cx="534.3" cy="270" r="7" fill="#059669" stroke="#ffffff" stroke-width="1.5"/>
  <text x="534.3" y="256" font-size="13" fill="#059669" text-anchor="middle" font-weight="bold">N=4</text>
  <text x="717.5" y="344" font-size="13" fill="#059669" text-anchor="middle">green dots: the real determinants for N = 1–4, computed for this explainer</text>
  <text x="717.5" y="362" font-size="13" fill="#059669" text-anchor="middle">(L_1 = −2.2356, L_2 = −2.2682, L_3 = −2.2785, L_4 = −2.2838)</text>
  <text x="160" y="424" font-size="15" font-weight="bold" fill="#111827">Zoom on the two walls: only 0.00013 apart, but they never touch</text>
  <rect x="160" y="440" width="163.5" height="44" fill="#dbeafe"/>
  <rect x="678.0" y="440" width="162.0" height="44" fill="#fde68a" opacity="0.8"/>
  <line x1="160" y1="484" x2="840" y2="484" stroke="#111827" stroke-width="2"/>
  <line x1="160.0" y1="478" x2="160.0" y2="490" stroke="#111827" stroke-width="1.2"/>
  <text x="160.0" y="508" font-size="12" fill="#111827" text-anchor="middle">−2.29100</text>
  <line x1="296.0" y1="478" x2="296.0" y2="490" stroke="#111827" stroke-width="1.2"/>
  <text x="296.0" y="508" font-size="12" fill="#111827" text-anchor="middle">−2.29095</text>
  <line x1="432.0" y1="478" x2="432.0" y2="490" stroke="#111827" stroke-width="1.2"/>
  <text x="432.0" y="508" font-size="12" fill="#111827" text-anchor="middle">−2.29090</text>
  <line x1="568.0" y1="478" x2="568.0" y2="490" stroke="#111827" stroke-width="1.2"/>
  <text x="568.0" y="508" font-size="12" fill="#111827" text-anchor="middle">−2.29085</text>
  <line x1="704.0" y1="478" x2="704.0" y2="490" stroke="#111827" stroke-width="1.2"/>
  <text x="704.0" y="508" font-size="12" fill="#111827" text-anchor="middle">−2.29080</text>
  <line x1="840.0" y1="478" x2="840.0" y2="490" stroke="#111827" stroke-width="1.2"/>
  <text x="840.0" y="508" font-size="12" fill="#111827" text-anchor="middle">−2.29075</text>
  <line x1="323.5" y1="434" x2="323.5" y2="490" stroke="#2563eb" stroke-width="2.5"/>
  <line x1="678.0" y1="434" x2="678.0" y2="490" stroke="#d97706" stroke-width="2.5"/>
  <text x="317.5" y="468" font-size="13" fill="#2563eb" text-anchor="end">ceiling −2.290939875</text>
  <text x="684.0" y="468" font-size="13" fill="#92400e">floor ≈ −2.290810</text>
  <text x="500.0" y="546" font-size="13" fill="#374151" text-anchor="middle">gap ≈ 0.00013, i.e. about 0.30·N² in log|Δ_N|. No number can sit in both bands, so "G is a fraction" must be false.</text>
</svg>
