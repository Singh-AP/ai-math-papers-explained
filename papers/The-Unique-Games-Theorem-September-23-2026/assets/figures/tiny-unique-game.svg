<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 500" width="1000" height="500" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#1565c0"/>
    </marker>
    <marker id="arg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#2e7d32"/>
    </marker>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#c62828"/>
    </marker>
    <marker id="argrey" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#6d4c41"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="1000" height="500" fill="#ffffff"/>

  <!-- ============ Panel A: a unique constraint ============ -->
  <text x="160" y="34" text-anchor="middle" font-size="17" font-weight="bold" fill="#222">A. A unique constraint</text>
  <text x="160" y="56" text-anchor="middle" font-size="13" fill="#555">rule on edge u–v:  label(v) = label(u) + 01</text>

  <text x="70" y="92" text-anchor="middle" font-size="15" font-weight="bold" fill="#333">u</text>
  <text x="250" y="92" text-anchor="middle" font-size="15" font-weight="bold" fill="#333">v</text>
  <g font-size="15" font-family="Menlo, Courier, monospace" text-anchor="middle" fill="#222">
    <rect x="45" y="108" width="50" height="30" rx="6" fill="#e3f2fd" stroke="#1565c0"/><text x="70" y="128">00</text>
    <rect x="45" y="163" width="50" height="30" rx="6" fill="#e3f2fd" stroke="#1565c0"/><text x="70" y="183">01</text>
    <rect x="45" y="218" width="50" height="30" rx="6" fill="#e3f2fd" stroke="#1565c0"/><text x="70" y="238">10</text>
    <rect x="45" y="273" width="50" height="30" rx="6" fill="#e3f2fd" stroke="#1565c0"/><text x="70" y="293">11</text>
    <rect x="225" y="108" width="50" height="30" rx="6" fill="#e3f2fd" stroke="#1565c0"/><text x="250" y="128">00</text>
    <rect x="225" y="163" width="50" height="30" rx="6" fill="#e3f2fd" stroke="#1565c0"/><text x="250" y="183">01</text>
    <rect x="225" y="218" width="50" height="30" rx="6" fill="#e3f2fd" stroke="#1565c0"/><text x="250" y="238">10</text>
    <rect x="225" y="273" width="50" height="30" rx="6" fill="#e3f2fd" stroke="#1565c0"/><text x="250" y="293">11</text>
  </g>
  <g stroke="#1565c0" stroke-width="2" fill="none" marker-end="url(#ar)">
    <line x1="97" y1="123" x2="223" y2="178"/>
    <line x1="97" y1="178" x2="223" y2="123"/>
    <line x1="97" y1="233" x2="223" y2="288"/>
    <line x1="97" y1="288" x2="223" y2="233"/>
  </g>
  <text x="160" y="340" text-anchor="middle" font-size="13" fill="#333">Each label at u allows exactly</text>
  <text x="160" y="358" text-anchor="middle" font-size="13" fill="#333">one label at v, and vice versa:</text>
  <text x="160" y="376" text-anchor="middle" font-size="13" fill="#333">the rule is a permutation.</text>

  <!-- ============ Panel B: a 2-to-1 constraint ============ -->
  <line x1="330" y1="20" x2="330" y2="400" stroke="#e0e0e0" stroke-width="1.5"/>
  <text x="485" y="34" text-anchor="middle" font-size="17" font-weight="bold" fill="#222">B. For contrast: 2-to-1</text>
  <text x="485" y="56" text-anchor="middle" font-size="13" fill="#555">rule on edge u–v:  label(v) = first bit of label(u)</text>

  <text x="395" y="92" text-anchor="middle" font-size="15" font-weight="bold" fill="#333">u</text>
  <text x="575" y="92" text-anchor="middle" font-size="15" font-weight="bold" fill="#333">v</text>
  <g font-size="15" font-family="Menlo, Courier, monospace" text-anchor="middle" fill="#222">
    <rect x="370" y="108" width="50" height="30" rx="6" fill="#efebe9" stroke="#6d4c41"/><text x="395" y="128">00</text>
    <rect x="370" y="163" width="50" height="30" rx="6" fill="#efebe9" stroke="#6d4c41"/><text x="395" y="183">01</text>
    <rect x="370" y="218" width="50" height="30" rx="6" fill="#efebe9" stroke="#6d4c41"/><text x="395" y="238">10</text>
    <rect x="370" y="273" width="50" height="30" rx="6" fill="#efebe9" stroke="#6d4c41"/><text x="395" y="293">11</text>
    <rect x="550" y="135" width="50" height="30" rx="6" fill="#efebe9" stroke="#6d4c41"/><text x="575" y="155">0</text>
    <rect x="550" y="245" width="50" height="30" rx="6" fill="#efebe9" stroke="#6d4c41"/><text x="575" y="265">1</text>
  </g>
  <g stroke="#6d4c41" stroke-width="2" fill="none" marker-end="url(#argrey)">
    <line x1="422" y1="123" x2="548" y2="148"/>
    <line x1="422" y1="178" x2="548" y2="153"/>
    <line x1="422" y1="233" x2="548" y2="258"/>
    <line x1="422" y1="288" x2="548" y2="263"/>
  </g>
  <text x="485" y="340" text-anchor="middle" font-size="13" fill="#333">Two labels at u share one reply</text>
  <text x="485" y="358" text-anchor="middle" font-size="13" fill="#333">at v. Label Cover allows rules like</text>
  <text x="485" y="376" text-anchor="middle" font-size="13" fill="#333">this; unique games do not.</text>

  <!-- ============ Panel C: an inconsistent triangle ============ -->
  <line x1="640" y1="20" x2="640" y2="400" stroke="#e0e0e0" stroke-width="1.5"/>
  <text x="820" y="34" text-anchor="middle" font-size="17" font-weight="bold" fill="#222">C. A small unique game</text>
  <text x="820" y="56" text-anchor="middle" font-size="13" fill="#555">labels are 2-bit strings; "+" is bitwise XOR</text>

  <!-- vertices -->
  <circle cx="820" cy="115" r="30" fill="#e8f5e9" stroke="#2e7d32" stroke-width="2"/>
  <text x="820" y="111" text-anchor="middle" font-size="15" font-weight="bold" fill="#222">u</text>
  <text x="820" y="129" text-anchor="middle" font-size="14" font-family="Menlo, Courier, monospace" fill="#1b5e20">00</text>
  <circle cx="705" cy="300" r="30" fill="#e8f5e9" stroke="#2e7d32" stroke-width="2"/>
  <text x="705" y="296" text-anchor="middle" font-size="15" font-weight="bold" fill="#222">v</text>
  <text x="705" y="314" text-anchor="middle" font-size="14" font-family="Menlo, Courier, monospace" fill="#1b5e20">01</text>
  <circle cx="935" cy="300" r="30" fill="#e8f5e9" stroke="#2e7d32" stroke-width="2"/>
  <text x="935" y="296" text-anchor="middle" font-size="15" font-weight="bold" fill="#222">w</text>
  <text x="935" y="314" text-anchor="middle" font-size="14" font-family="Menlo, Courier, monospace" fill="#1b5e20">11</text>

  <!-- edges -->
  <line x1="804" y1="141" x2="722" y2="273" stroke="#2e7d32" stroke-width="2.5" marker-end="url(#arg)"/>
  <line x1="737" y1="300" x2="901" y2="300" stroke="#2e7d32" stroke-width="2.5" marker-end="url(#arg)"/>
  <line x1="918" y1="273" x2="837" y2="141" stroke="#c62828" stroke-width="2.5" stroke-dasharray="7 4" marker-end="url(#arr)"/>

  <!-- edge labels -->
  <text x="742" y="196" text-anchor="end" font-size="14" fill="#1b5e20">v = u + 01  ✓</text>
  <text x="820" y="326" text-anchor="middle" font-size="14" fill="#1b5e20">w = v + 10  ✓</text>
  <text x="890" y="196" font-size="14" fill="#b71c1c">u = w + 10 ?</text>
  <text x="890" y="214" font-size="13" fill="#b71c1c">needs u = 01  ✗</text>

  <text x="820" y="358" text-anchor="middle" font-size="13" fill="#333">Start u = 00 and follow the rules: v = 01, w = 11.</text>
  <text x="820" y="376" text-anchor="middle" font-size="13" fill="#333">The third rule then demands u = 01. Around the loop the</text>
  <text x="820" y="394" text-anchor="middle" font-size="13" fill="#333">shifts add up to 01 + 10 + 10 = 01, not 00.</text>

  <!-- bottom band -->
  <rect x="20" y="420" width="960" height="66" rx="8" fill="#fff8e1" stroke="#f9a825"/>
  <text x="500" y="446" text-anchor="middle" font-size="14" fill="#333">No labeling satisfies all three rules, and following two of them always works, so this game has value 2/3.</text>
  <text x="500" y="468" text-anchor="middle" font-size="14" fill="#333">Fully satisfiable unique games are easy (guess one label, propagate). The conjecture is about games that are only 99% satisfiable.</text>
</svg>
