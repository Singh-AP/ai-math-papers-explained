<svg xmlns="http://www.w3.org/2000/svg" width="980" height="540" viewBox="0 0 980 540" font-family="Helvetica, Arial, DejaVu Sans, sans-serif">
  <rect x="0" y="0" width="980" height="540" fill="#ffffff"/>
  <text x="490" y="34" text-anchor="middle" font-size="21" font-weight="bold" fill="#222">How the paper builds in "odd overlap" (Section 2)</text>
  <text x="490" y="58" text-anchor="middle" font-size="14" fill="#555">Each vertex's set of outgoing labels = one line of a projective plane + a few extra letters</text>

  <!-- Left: Fano plane -->
  <rect x="20" y="76" width="400" height="384" rx="12" fill="#f8f8f8" stroke="#bbbbbb"/>
  <text x="220" y="100" text-anchor="middle" font-size="15" font-weight="bold" fill="#333">Smallest example: the Fano plane (q = 2)</text>
  <!-- all 7 lines in grey -->
  <g stroke="#c8c8c8" stroke-width="2" fill="none">
    <line x1="220" y1="125" x2="90" y2="350"/>
    <line x1="220" y1="125" x2="350" y2="350"/>
    <line x1="90" y1="350" x2="350" y2="350"/>
    <line x1="90" y1="350" x2="285" y2="237.5"/>
    <line x1="350" y1="350" x2="155" y2="237.5"/>
    <line x1="220" y1="125" x2="220" y2="350"/>
    <circle cx="220" cy="275" r="75"/>
  </g>
  <!-- highlighted lines -->
  <line x1="90" y1="350" x2="350" y2="350" stroke="#c0392b" stroke-width="5"/>
  <line x1="220" y1="125" x2="220" y2="350" stroke="#1b6ca8" stroke-width="5"/>
  <!-- points -->
  <g fill="#ffffff" stroke="#333" stroke-width="2">
    <circle cx="220" cy="125" r="8"/>
    <circle cx="90" cy="350" r="8"/>
    <circle cx="350" cy="350" r="8"/>
    <circle cx="155" cy="237.5" r="8"/>
    <circle cx="285" cy="237.5" r="8"/>
    <circle cx="220" cy="275" r="8"/>
  </g>
  <circle cx="220" cy="350" r="9" fill="#f1c40f" stroke="#333" stroke-width="2"/>
  <circle cx="220" cy="350" r="15" fill="none" stroke="#f39c12" stroke-width="2.5"/>
  <text x="352" y="378" text-anchor="middle" font-size="13" fill="#c0392b">red line</text>
  <text x="232" y="160" font-size="13" fill="#1b6ca8">blue line</text>
  <text x="220" y="402" text-anchor="middle" font-size="14" fill="#333">7 points, 7 lines, 3 points on each line.</text>
  <text x="220" y="424" text-anchor="middle" font-size="14" fill="#333">Two different lines share exactly 1 point.</text>
  <text x="220" y="446" text-anchor="middle" font-size="14" fill="#333">A line shares q + 1 = 3 points with itself.</text>

  <!-- Right: the recipe -->
  <rect x="440" y="76" width="520" height="384" rx="12" fill="#f4f8fc" stroke="#9db7d0"/>
  <text x="460" y="104" font-size="15" font-weight="bold" fill="#1b4f72">The paper's recipe, with q = 128</text>
  <text x="460" y="130" font-size="14" fill="#222">Letters: the 16,513 points of the plane over 𝔽₁₂₈, plus 3 extras e₁, e₂, e₃.</text>
  <text x="460" y="150" font-size="14" fill="#222">Paired into 8,258 inverse pairs: one generator of G per pair.</text>

  <text x="460" y="184" font-size="14" font-weight="bold" fill="#333">Ordinary part of S_x: a line (129 points)</text>
  <text x="476" y="206" font-size="14" fill="#222">two lines share 1 point, or 129 if they are equal:</text>
  <text x="476" y="226" font-size="14" fill="#c0392b" font-weight="bold">always odd (q = 128 is even, so q + 1 is odd)</text>

  <text x="460" y="260" font-size="14" font-weight="bold" fill="#333">Extra part of S_x</text>
  <text x="476" y="282" font-size="14" fill="#222">A-vertices: none, or exactly two of {e₁, e₂, e₃}</text>
  <text x="476" y="302" font-size="14" fill="#222">B-vertices: none, or all three</text>
  <text x="476" y="322" font-size="14" fill="#1b6ca8" font-weight="bold">shared extras: 0 or 2, always even</text>

  <rect x="456" y="342" width="488" height="58" rx="8" fill="#1b6ca8"/>
  <text x="700" y="366" text-anchor="middle" font-size="16" font-weight="bold" fill="#ffffff">|S_x ∩ S_y| = odd + even = odd</text>
  <text x="700" y="388" text-anchor="middle" font-size="14" fill="#ffffff">for every x in A and every y in B</text>
  <text x="460" y="426" font-size="13" fill="#555">Built in before any randomness: the random matching of edges</text>
  <text x="460" y="444" font-size="13" fill="#555">can never break it. Each vertex has 129 to 132 outgoing labels.</text>

  <rect x="20" y="474" width="940" height="52" rx="10" fill="#fff6e5" stroke="#e0a43a"/>
  <text x="34" y="497" font-size="14" fill="#333">Why it matters: in the graph of simultaneous steps on pairs (x, y), the degree of (x, y) is exactly |S_x ∩ S_y|.</text>
  <text x="34" y="517" font-size="14" fill="#333">All degrees odd ⇒ every connected component has an even number of pairs ⇒ everything cancels over 𝔽₂.</text>
</svg>
