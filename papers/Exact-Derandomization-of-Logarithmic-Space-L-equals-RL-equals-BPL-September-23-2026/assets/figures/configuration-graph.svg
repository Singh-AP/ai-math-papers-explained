<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 680" width="1180" height="680" font-family="Helvetica, Arial, sans-serif">
<title>The configuration graph of a tiny randomized log-space computation</title>
<desc>A random walk on the path 0-1-2-3 starting at 0, one fair coin per step, six steps, vertex 3 absorbing. Columns are times 0 to 6, rows are walk positions 0 to 3. Each node shows the probability of accepting from that configuration, the vector p0 = (I - S)^(-1) e of the paper. The start node at time 0, position 0 has value 7/16. Nodes the walk can actually reach from the start are drawn in colour; the others are grey.</desc>
<rect x="0" y="0" width="1180" height="680" fill="#fcfcfb"/>
<text x="40" y="42" font-size="22" font-weight="bold" fill="#0b0b0b">A tiny randomized log-space computation, drawn as its configuration graph</text>
<text x="40" y="68" font-size="14" fill="#52514e">Random walk on the path 0 – 1 – 2 – 3, start at 0, one fair coin per step, 6 steps; accept if the walk has reached 3 (3 is absorbing).</text>
<text x="40" y="88" font-size="14" fill="#52514e">Each node is a configuration (time, position). The number inside is the probability of accepting from there: the vector p₀ = (I − S)⁻¹e.</text>
