<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 600" width="1000" height="600" font-family="Helvetica, Arial, sans-serif">
  <title>Where the zeros of the zeta function can and cannot be</title>
  <desc>The complex plane with the critical strip 0 &lt; Re(s) &lt; 1, the critical line Re(s) = 1/2, the 1896 line Re(s) = 1, and the new zero-free half-plane Re(s) &gt; 7/8.</desc>
  <rect x="0" y="0" width="1000" height="600" fill="#ffffff"/>

  <!-- Coordinates: x = 60 + (Re + 0.2) * 520 ; y = 300 - 7.5 * Im -->
  <!-- Critical strip 0 < Re < 1 : x 164 .. 684 -->
  <rect x="164" y="50" width="520" height="500" fill="#eef2ff"/>

  <!-- New zero-free half-plane Re > 7/8 : x >= 619 -->
  <rect x="619" y="50" width="281" height="500" fill="#d1fae5" opacity="0.85"/>
  <!-- Half-plane Re > 1 (never had zeros: Euler product) -->
  <rect x="684" y="50" width="216" height="500" fill="#a7f3d0" opacity="0.6"/>

  <!-- Classical zero-free region (schematic): sigma > 1 - c / log(|t| + 3) -->
  <path d="M 684 50 C 676 120, 668 220, 660 300 C 668 380, 676 480, 684 550"
        fill="none" stroke="#6b7280" stroke-width="2" stroke-dasharray="3 4"/>

  <!-- Axes -->
  <line x1="40" y1="300" x2="920" y2="300" stroke="#111827" stroke-width="1.5"/>
  <polygon points="920,300 910,295 910,305" fill="#111827"/>
  <line x1="164" y1="560" x2="164" y2="40" stroke="#111827" stroke-width="1.5"/>
  <polygon points="164,40 159,50 169,50" fill="#111827"/>
  <text x="926" y="306" font-size="16" fill="#111827">Re(s)</text>
  <text x="172" y="44" font-size="16" fill="#111827">Im(s)</text>

  <!-- Critical line Re = 1/2 : x = 424 -->
  <line x1="424" y1="50" x2="424" y2="550" stroke="#dc2626" stroke-width="2.5" stroke-dasharray="8 6"/>
  <!-- Line 11/12 : x = 640.7 -->
  <line x1="640.7" y1="50" x2="640.7" y2="550" stroke="#0f766e" stroke-width="1.5" stroke-dasharray="2 3"/>
  <!-- Line 7/8 : x = 619 -->
  <line x1="619" y1="50" x2="619" y2="550" stroke="#059669" stroke-width="3"/>
  <!-- Line Re = 1 : x = 684 -->
  <line x1="684" y1="50" x2="684" y2="550" stroke="#1f2937" stroke-width="2.5"/>

  <!-- Known zeros on the critical line (heights 14.13, 21.02, 25.01, 30.42, 32.94) -->
  <g fill="#7c3aed">
    <circle cx="424" cy="194.0" r="6"/><circle cx="424" cy="406.0" r="6"/>
    <circle cx="424" cy="142.3" r="6"/><circle cx="424" cy="457.7" r="6"/>
    <circle cx="424" cy="112.4" r="6"/><circle cx="424" cy="487.6" r="6"/>
    <circle cx="424" cy="71.8" r="6"/><circle cx="424" cy="528.2" r="6"/>
  </g>
  <!-- Trivial zeros hint (negative even integers lie far to the left) -->
  <text x="48" y="292" font-size="13" fill="#6b7280">← trivial zeros</text>
  <text x="48" y="320" font-size="13" fill="#6b7280">at −2, −4, −6, …</text>

  <!-- Pole at s = 1 -->
  <g stroke="#b91c1c" stroke-width="3">
    <line x1="676" y1="292" x2="692" y2="308"/>
    <line x1="692" y1="292" x2="676" y2="308"/>
  </g>

  <!-- Tick labels -->
  <g font-size="15" fill="#111827" text-anchor="middle">
    <text x="164" y="580">0</text>
    <text x="424" y="580">1/2</text>
    <text x="612" y="580">7/8</text>
    <text x="646" y="596" font-size="12" fill="#0f766e">11/12</text>
    <text x="690" y="580">1</text>
  </g>

  <!-- Callouts -->
  <g font-size="14">
    <rect x="198" y="60" width="200" height="66" rx="8" fill="#ffffff" stroke="#dc2626"/>
    <text x="208" y="82" fill="#dc2626" font-weight="bold">Riemann Hypothesis</text>
    <text x="208" y="100" fill="#111827">all zeros on this line?</text>
    <text x="208" y="114" fill="#6b7280" font-size="12">open since 1859</text>

    <rect x="712" y="62" width="200" height="74" rx="8" fill="#ffffff" stroke="#059669"/>
    <text x="722" y="84" fill="#047857" font-weight="bold">No zeros at all here</text>
    <text x="722" y="102" fill="#111827">Re(s) &gt; 7/8 — this paper</text>
    <text x="722" y="118" fill="#111827" font-size="12">(first stage: Re(s) &gt; 11/12)</text>
    <text x="722" y="132" fill="#6b7280" font-size="12">OpenAI, 2026</text>

    <rect x="712" y="420" width="200" height="74" rx="8" fill="#ffffff" stroke="#1f2937"/>
    <text x="722" y="442" fill="#1f2937" font-weight="bold">No zeros on Re(s) = 1</text>
    <text x="722" y="460" fill="#111827" font-size="12">Hadamard &amp; de la Vallée</text>
    <text x="722" y="474" fill="#111827" font-size="12">Poussin, 1896 → Prime</text>
    <text x="722" y="488" fill="#111827" font-size="12">Number Theorem</text>

    <rect x="456" y="420" width="148" height="74" rx="8" fill="#ffffff" stroke="#6b7280"/>
    <text x="464" y="440" fill="#374151" font-size="12" font-weight="bold">Old zero-free region</text>
    <text x="464" y="456" fill="#374151" font-size="12">(dotted curve) hugs</text>
    <text x="464" y="470" fill="#374151" font-size="12">Re(s) = 1 and gets</text>
    <text x="464" y="484" fill="#374151" font-size="12">thinner going up</text>

    <text x="430" y="262" fill="#7c3aed" font-size="12">known zeros</text>
    <text x="430" y="276" fill="#7c3aed" font-size="12">1/2 + 14.13i, …</text>
    <text x="700" y="318" fill="#b91c1c" font-size="12">pole at s = 1</text>
  </g>
</svg>
