<line x1="191.0" y1="309" x2="209.0" y2="291" stroke="#dc2626" stroke-width="3"/>
<text x="560.0" y="375.0" font-family="Helvetica, Arial, sans-serif" font-size="13" text-anchor="middle" fill="#1f2933" font-weight="normal" font-style="normal">Green dots: the only values an integral class can have, multiples of &#363;/L (Theorem 4.7). The value 1/8 &#363; lies strictly between 0 and &#363;/4.</text>
<text x="560.0" y="397.0" font-family="Helvetica, Arial, sans-serif" font-size="13" text-anchor="middle" fill="#1f2933" font-weight="normal" font-style="normal">With 16 = 4L parts, each part would be 1/4 &#363;, still allowed. 32 parts is the first impossible case, because 32 &gt; 4L = 16.</text>
<text x="560.0" y="419.0" font-family="Helvetica, Arial, sans-serif" font-size="13" text-anchor="middle" fill="#52606d" font-weight="normal" font-style="normal">In the paper the lattice is far finer: for d = 3, L = 2<tspan baseline-shift='super' font-size='70%'>546</tspan>, so p = 2 needs k &#8805; 549. But L is fixed before k is chosen,</text>
<text x="560.0" y="441.0" font-family="Helvetica, Arial, sans-serif" font-size="13" text-anchor="middle" fill="#52606d" font-weight="normal" font-style="normal">and a faithful action of the p-adic integers supplies p<tspan baseline-shift='super' font-size='70%'>k</tspan> equal parts for every k.</text>
</svg>
