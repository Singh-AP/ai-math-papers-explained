<text x="1040.0" y="88.0" font-family="Helvetica, Arial, sans-serif" font-size="14" text-anchor="end" fill="#2563eb" font-weight="bold" font-style="normal">each part = 4&#363; / 32 = 1/8 &#363;</text>
