<circle cx="80.0" cy="300" r="8" fill="#059669"/>
<text x="80.0" y="332.0" font-family="Helvetica, Arial, sans-serif" font-size="13" text-anchor="middle" fill="#059669" font-weight="bold" font-style="normal">0</text>
