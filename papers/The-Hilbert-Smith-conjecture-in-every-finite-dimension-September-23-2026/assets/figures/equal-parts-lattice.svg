<text x="560.0" y="34.0" font-family="Helvetica, Arial, sans-serif" font-size="18" text-anchor="middle" fill="#1f2933" font-weight="bold" font-style="normal">The final contradiction: equal parts that are too small for the lattice (toy numbers L = 4, p = 2, k = 5)</text>
