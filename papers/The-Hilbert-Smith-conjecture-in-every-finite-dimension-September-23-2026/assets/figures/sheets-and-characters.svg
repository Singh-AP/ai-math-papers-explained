<text x="905.0" y="118.0" font-family="Helvetica, Arial, sans-serif" font-size="14" text-anchor="middle" fill="#1f2933" font-weight="bold" font-style="normal">i</text>
<text x="748.0" y="275.0" font-family="Helvetica, Arial, sans-serif" font-size="14" text-anchor="middle" fill="#1f2933" font-weight="bold" font-style="normal">&#8722;1</text>
<text x="905.0" y="432.0" font-family="Helvetica, Arial, sans-serif" font-size="14" text-anchor="middle" fill="#1f2933" font-weight="bold" font-style="normal">&#8722;i</text>
<path d="M 756.7 373.8 A 181 181 0 0 1 756.7 166.2" fill="none" stroke="#dc2626" stroke-width="2.4" marker-end="url(#arrR)"/>
<text x="736.1" y="164.5" font-family="Helvetica, Arial, sans-serif" font-size="13" text-anchor="end" fill="#dc2626" font-weight="bold" font-style="normal">&#215;&#946;: a quarter turn</text>
<text x="736.1" y="182.5" font-family="Helvetica, Arial, sans-serif" font-size="13" text-anchor="end" fill="#dc2626" font-weight="bold" font-style="normal">clockwise</text>
<text x="905.0" y="468.0" font-family="Helvetica, Arial, sans-serif" font-size="12.5" text-anchor="middle" fill="#1f2933" font-weight="normal" font-style="normal">Partition: D<tspan baseline-shift='sub' font-size='70%'>i</tspan> = the quarter-circle of angles [90i&#176;, 90(i+1)&#176;).</text>
<text x="905.0" y="485.0" font-family="Helvetica, Arial, sans-serif" font-size="12.5" text-anchor="middle" fill="#1f2933" font-weight="normal" font-style="normal">Multiplying by &#946; sends the &#955;-part to the &#950;<tspan baseline-shift='super' font-size='70%'>&#8722;1</tspan>&#955;-part,</text>
<text x="905.0" y="502.0" font-family="Helvetica, Arial, sans-serif" font-size="12.5" text-anchor="middle" fill="#1f2933" font-weight="normal" font-style="normal">a quarter turn: D<tspan baseline-shift='sub' font-size='70%'>1</tspan> &#8594; D<tspan baseline-shift='sub' font-size='70%'>0</tspan>, D<tspan baseline-shift='sub' font-size='70%'>2</tspan> &#8594; D<tspan baseline-shift='sub' font-size='70%'>1</tspan>, D<tspan baseline-shift='sub' font-size='70%'>3</tspan> &#8594; D<tspan baseline-shift='sub' font-size='70%'>2</tspan>, D<tspan baseline-shift='sub' font-size='70%'>0</tspan> &#8594; D<tspan baseline-shift='sub' font-size='70%'>3</tspan>.</text>
<text x="905.0" y="519.0" font-family="Helvetica, Arial, sans-serif" font-size="12.5" text-anchor="middle" fill="#1f2933" font-weight="normal" font-style="normal">It preserves the form, so for any test concentrated over V,</text>
<text x="905.0" y="536.0" font-family="Helvetica, Arial, sans-serif" font-size="12.5" text-anchor="middle" fill="#1f2933" font-weight="normal" font-style="normal">z<tspan baseline-shift='sub' font-size='70%'>0</tspan> = z<tspan baseline-shift='sub' font-size='70%'>1</tspan> = z<tspan baseline-shift='sub' font-size='70%'>2</tspan> = z<tspan baseline-shift='sub' font-size='70%'>3</tspan>   (Proposition 6.7).</text>
