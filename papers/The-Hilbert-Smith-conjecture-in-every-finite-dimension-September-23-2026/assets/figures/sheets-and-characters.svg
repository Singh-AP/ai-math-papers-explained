<text x="538.0" y="223.0" font-family="Helvetica, Arial, sans-serif" font-size="13" text-anchor="start" fill="#dc2626" font-weight="normal" font-style="normal">sheet j to j+1</text>
<text x="538.0" y="241.0" font-family="Helvetica, Arial, sans-serif" font-size="13" text-anchor="start" fill="#dc2626" font-weight="normal" font-style="normal">(and 3 back to 0)</text>
<text x="538.0" y="271.0" font-family="Helvetica, Arial, sans-serif" font-size="13" text-anchor="start" fill="#1f2933" font-weight="normal" font-style="normal">so &#946;(1&#183;w) = &#950;&#183;&#946;(w)</text>
<text x="905.0" y="82.0" font-family="Helvetica, Arial, sans-serif" font-size="15" text-anchor="middle" fill="#1f2933" font-weight="bold" font-style="normal">Characters of G: the 2-power roots of unity</text>
