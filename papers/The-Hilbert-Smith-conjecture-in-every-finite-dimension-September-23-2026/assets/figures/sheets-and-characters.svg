<text x="560.0" y="34.0" font-family="Helvetica, Arial, sans-serif" font-size="17" text-anchor="middle" fill="#1f2933" font-weight="bold" font-style="normal">How a faithful action makes the p<tspan baseline-shift='super' font-size='70%'>k</tspan> character classes equal (picture with p = 2, k = 2, so p<tspan baseline-shift='super' font-size='70%'>k</tspan> = 4 and &#950; = i)</text>
<polygon points="130.0,110.0 460.0,110.0 400.0,156.0 70.0,156.0" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
