<text x="665.0" y="445.0" font-family="Helvetica, Arial, sans-serif" font-size="13" text-anchor="middle" fill="#222" font-weight="normal" font-style="normal">All three lines have slope −1. Their ratio does not depend on N: 3u ÷ (u/2π²) = 6π² ≈ 59.2,</text>
<text x="665.0" y="463.0" font-family="Helvetica, Arial, sans-serif" font-size="13" text-anchor="middle" fill="#222"><tspan dy="0" font-size="13">which is the factor 6π² in the paper's constant c</tspan><tspan dy="4" font-size="10">1</tspan><tspan dy="-4" dx="3" font-size="13">= 6π²(1 + 4c</tspan><tspan dy="4" font-size="10">0</tspan><tspan dy="-4" font-size="13">).</tspan></text>
