<text x="175.0" y="70.0" font-family="Helvetica, Arial, sans-serif" font-size="14" text-anchor="middle" fill="#222" font-weight="normal" font-style="normal">f = 1 − θ/π on the red arc, −θ/π elsewhere</text>
<text x="175.0" y="90.0" font-family="Helvetica, Arial, sans-serif" font-size="13" text-anchor="middle" fill="#555" font-weight="normal" font-style="normal">θ = 1/(2N), drawn here for N = 5</text>
<text x="175.0" y="372.0" font-family="Helvetica, Arial, sans-serif" font-size="13" text-anchor="middle" fill="#222"><tspan dy="0" font-size="13">Fourier coefficients γ</tspan><tspan dy="4" font-size="10">l</tspan><tspan dy="-4" dx="3" font-size="13">= sin(lθ)/(πl).</tspan></text>
<text x="175.0" y="392.0" font-family="Helvetica, Arial, sans-serif" font-size="13" text-anchor="middle" fill="#222"><tspan dy="0" font-size="13">Hankel matrix H</tspan><tspan dy="4" font-size="10">f</tspan><tspan dy="-4" dx="3" font-size="13">= (γ</tspan><tspan dy="4" font-size="10">j+k+1</tspan><tspan dy="-4" font-size="13">), j, k ≥ 0.</tspan></text>
<text x="175.0" y="412.0" font-family="Helvetica, Arial, sans-serif" font-size="13" text-anchor="middle" fill="#222" font-weight="normal" font-style="normal">Every entry with j, k &lt; N is ≥ 2θ/π².</text>
