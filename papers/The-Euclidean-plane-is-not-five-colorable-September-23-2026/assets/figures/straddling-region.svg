  <text x="371.19" y="169.93" font-size="22" font-style="italic" fill="#1d4ed8">K</text>
  <line x1="110.00" y1="330.00" x2="397.50" y2="348.40" stroke="#374151" stroke-width="2"/>
  <line x1="318.81" y1="207.86" x2="397.50" y2="348.40" stroke="#374151" stroke-width="2"/>
  <line x1="175.81" y1="287.13" x2="397.50" y2="348.40" stroke="#dc2626" stroke-width="3"/>
  <circle cx="110.00" cy="330.00" r="7" fill="#111827"/>
  <text x="86.00" y="338.00" font-size="22" font-style="italic" fill="#111827">x</text>
  <circle cx="318.81" cy="207.86" r="7" fill="#111827"/>
  <text x="310.81" y="189.86" font-size="22" font-style="italic" fill="#111827">q</text>
  <circle cx="175.81" cy="287.13" r="7" fill="#dc2626"/>
  <text x="149.81" y="281.13" font-size="22" font-style="italic" fill="#dc2626">p</text>
  <circle cx="397.50" cy="348.40" r="7" fill="#111827"/>
  <text x="411.50" y="374.40" font-size="22" font-style="italic" fill="#111827">z</text>
  <text x="253.75" y="365.20" font-size="16" fill="#111827" text-anchor="middle">more than 1</text>
  <text x="398.15" y="274.13" font-size="16" fill="#111827" text-anchor="middle">less than 1</text>
  <text x="284.66" y="305.76" font-size="16" font-weight="bold" fill="#dc2626" text-anchor="middle">exactly 1</text>
  <text x="690" y="64" font-size="22" font-weight="bold" fill="#111827">Straddling a connected set</text>
  <text x="690" y="98" font-size="16" fill="#111827">Walk along K from x to q. Your distance to z</text>
  <text x="690" y="126" font-size="16" fill="#111827">changes continuously from more than 1 to less</text>
  <text x="690" y="154" font-size="16" fill="#111827">than 1, so at some point p it is exactly 1.</text>
  <text x="690" y="190" font-size="16" fill="#111827">Such points z form the open region Δ(K): some</text>
  <text x="690" y="218" font-size="16" fill="#111827">points of K are nearer than 1 to z, others farther.</text>
  <text x="690" y="254" font-size="16" fill="#111827">The paper builds connected sets K from the</text>
  <text x="690" y="282" font-size="16" fill="#111827">coloring, each tagged with two colors that are</text>
  <text x="690" y="310" font-size="16" fill="#111827">absent (almost everywhere) from all of Δ(K).</text>
  <text x="690" y="346" font-size="16" fill="#111827">The curve is only a cartoon: the paper's sets</text>
  <text x="690" y="374" font-size="16" fill="#111827">need not be curves, and no smoothness is assumed.</text>
  <text x="690" y="402" font-size="16" fill="#111827">Connectedness alone still forces such a point p.</text>
</svg>
