<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 620" width="1000" height="620" font-family="Helvetica, Arial, sans-serif">
  <title>The Moser spindle: seven points that cannot be properly colored with three colors</title>
  <desc>Two unit rhombi (each made of two equilateral triangles) share the vertex O and are rotated so that their far tips T and T-prime are exactly 1 apart. In any three-coloring the tips are forced to have the color of O, so the unit edge T T-prime is monochromatic.</desc>
  <rect x="0" y="0" width="1000" height="620" fill="#ffffff"/>
  <polygon points="250.00,560.00 67.82,388.80 307.18,316.63" fill="#f3f4f6" stroke="none"/>
  <polygon points="67.82,388.80 307.18,316.63 125.00,145.42" fill="#f3f4f6" stroke="none"/>
  <polygon points="250.00,560.00 192.82,316.63 432.18,388.80" fill="#f3f4f6" stroke="none"/>
  <polygon points="192.82,316.63 432.18,388.80 375.00,145.42" fill="#f3f4f6" stroke="none"/>
  <line x1="250.00" y1="560.00" x2="67.82" y2="388.80" stroke="#374151" stroke-width="3"/>
  <line x1="250.00" y1="560.00" x2="307.18" y2="316.63" stroke="#374151" stroke-width="3"/>
  <line x1="67.82" y1="388.80" x2="307.18" y2="316.63" stroke="#374151" stroke-width="3"/>
  <line x1="67.82" y1="388.80" x2="125.00" y2="145.42" stroke="#374151" stroke-width="3"/>
  <line x1="307.18" y1="316.63" x2="125.00" y2="145.42" stroke="#374151" stroke-width="3"/>
  <line x1="250.00" y1="560.00" x2="192.82" y2="316.63" stroke="#374151" stroke-width="3"/>
  <line x1="250.00" y1="560.00" x2="432.18" y2="388.80" stroke="#374151" stroke-width="3"/>
  <line x1="192.82" y1="316.63" x2="432.18" y2="388.80" stroke="#374151" stroke-width="3"/>
  <line x1="192.82" y1="316.63" x2="375.00" y2="145.42" stroke="#374151" stroke-width="3"/>
  <line x1="432.18" y1="388.80" x2="375.00" y2="145.42" stroke="#374151" stroke-width="3"/>
  <line x1="125.00" y1="145.42" x2="375.00" y2="145.42" stroke="#dc2626" stroke-width="6" stroke-dasharray="10 6"/>
  <text x="250.00" y="123.42" font-size="18" font-weight="bold" fill="#b91c1c" text-anchor="middle">distance 1, same color!</text>
  <circle cx="250.00" cy="560.00" r="17" fill="#dc2626" stroke="#111827" stroke-width="2"/>
  <text x="250.00" y="566.00" font-size="17" font-weight="bold" fill="#ffffff" text-anchor="middle">1</text>
  <text x="250.00" y="604.00" font-size="20" font-style="italic" fill="#111827" text-anchor="middle">O</text>
  <circle cx="67.82" cy="388.80" r="17" fill="#2563eb" stroke="#111827" stroke-width="2"/>
  <text x="67.82" y="394.80" font-size="17" font-weight="bold" fill="#ffffff" text-anchor="middle">2</text>
  <text x="27.82" y="392.80" font-size="20" font-style="italic" fill="#111827" text-anchor="middle">A</text>
  <circle cx="307.18" cy="316.63" r="17" fill="#f59e0b" stroke="#111827" stroke-width="2"/>
  <text x="307.18" y="322.63" font-size="17" font-weight="bold" fill="#111827" text-anchor="middle">3</text>
  <text x="345.18" y="324.63" font-size="20" font-style="italic" fill="#111827" text-anchor="middle">B</text>
  <circle cx="125.00" cy="145.42" r="17" fill="#dc2626" stroke="#111827" stroke-width="2"/>
  <text x="125.00" y="151.42" font-size="17" font-weight="bold" fill="#ffffff" text-anchor="middle">1</text>
  <text x="95.00" y="123.42" font-size="20" font-style="italic" fill="#111827" text-anchor="middle">T</text>
  <circle cx="192.82" cy="316.63" r="17" fill="#f59e0b" stroke="#111827" stroke-width="2"/>
  <text x="192.82" y="322.63" font-size="17" font-weight="bold" fill="#111827" text-anchor="middle">3</text>
  <text x="154.82" y="324.63" font-size="20" font-style="italic" fill="#111827" text-anchor="middle">A′</text>
  <circle cx="432.18" cy="388.80" r="17" fill="#2563eb" stroke="#111827" stroke-width="2"/>
  <text x="432.18" y="394.80" font-size="17" font-weight="bold" fill="#ffffff" text-anchor="middle">2</text>
  <text x="472.18" y="392.80" font-size="20" font-style="italic" fill="#111827" text-anchor="middle">B′</text>
  <circle cx="375.00" cy="145.42" r="17" fill="#dc2626" stroke="#111827" stroke-width="2"/>
  <text x="375.00" y="151.42" font-size="17" font-weight="bold" fill="#ffffff" text-anchor="middle">1</text>
  <text x="407.00" y="123.42" font-size="20" font-style="italic" fill="#111827" text-anchor="middle">T′</text>
  <text x="560" y="70" font-size="24" font-weight="bold" fill="#111827">The Moser spindle (1961)</text>
  <text x="560" y="107" font-size="17" fill="#111827">7 points, 11 segments, every segment has length 1.</text>
  <text x="560" y="137" font-size="17" fill="#111827">Each diamond is two equilateral triangles glued</text>
  <text x="560" y="167" font-size="17" fill="#111827">along an edge. The right diamond is the left one</text>
  <text x="560" y="197" font-size="17" fill="#111827">rotated about O by the angle θ with cos θ = 5/6.</text>
  <text x="560" y="237" font-size="19" font-weight="bold" fill="#111827">Try to use only 3 colors:</text>
  <text x="560" y="269" font-size="17" fill="#111827">1.  Give O color 1.</text>
  <text x="560" y="299" font-size="17" fill="#111827">2.  A and B are 1 from O and from each other,</text>
  <text x="585" y="329" font-size="17" fill="#111827">so they take the other two colors, 2 and 3.</text>
  <text x="560" y="359" font-size="17" fill="#111827">3.  T is 1 from both A and B, so T must be color 1.</text>
  <text x="560" y="389" font-size="17" fill="#111827">4.  The same argument in the other diamond</text>
  <text x="585" y="419" font-size="17" fill="#111827">forces T′ to be color 1 too.</text>
  <text x="560" y="449" font-size="17" fill="#111827">5.  But T and T′ are exactly 1 apart.</text>
  <text x="560" y="489" font-size="19" font-weight="bold" fill="#111827">So 3 colors never work: the plane needs ≥ 4.</text>
  <circle cx="574" cy="535" r="12" fill="#dc2626" stroke="#111827" stroke-width="1.5"/>
  <text x="574" y="540" font-size="13" font-weight="bold" fill="#ffffff" text-anchor="middle">1</text>
  <text x="594" y="541" font-size="16" fill="#111827">color 1</text>
  <circle cx="694" cy="535" r="12" fill="#2563eb" stroke="#111827" stroke-width="1.5"/>
  <text x="694" y="540" font-size="13" font-weight="bold" fill="#ffffff" text-anchor="middle">2</text>
  <text x="714" y="541" font-size="16" fill="#111827">color 2</text>
  <circle cx="814" cy="535" r="12" fill="#f59e0b" stroke="#111827" stroke-width="1.5"/>
  <text x="814" y="540" font-size="13" font-weight="bold" fill="#111827" text-anchor="middle">3</text>
  <text x="834" y="541" font-size="16" fill="#111827">color 3</text>
</svg>
