<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 560" width="1000" height="560" font-family="Helvetica, Arial, sans-serif">
  <title>On the unit circle around a point, directions 60 degrees apart are exactly 1 apart</title>
  <desc>A point x, its unit circle, and six points on it spaced 60 degrees apart. Neighbouring points form unit equilateral triangles with x, so in a proper coloring they get different colors, and none of them can share the color of x.</desc>
  <rect x="0" y="0" width="1000" height="560" fill="#ffffff"/>
  <circle cx="270.0" cy="280.0" r="200.0" fill="none" stroke="#6b7280" stroke-width="2" stroke-dasharray="6 5"/>
  <polygon points="270.00,280.00 457.94,211.60 304.73,83.04" fill="#fef3c7" stroke="none"/>
  <line x1="270.00" y1="280.00" x2="457.94" y2="211.60" stroke="#9ca3af" stroke-width="2"/>
  <line x1="270.00" y1="280.00" x2="304.73" y2="83.04" stroke="#9ca3af" stroke-width="2"/>
  <line x1="270.00" y1="280.00" x2="116.79" y2="151.44" stroke="#9ca3af" stroke-width="2"/>
  <line x1="270.00" y1="280.00" x2="82.06" y2="348.40" stroke="#9ca3af" stroke-width="2"/>
  <line x1="270.00" y1="280.00" x2="235.27" y2="476.96" stroke="#9ca3af" stroke-width="2"/>
  <line x1="270.00" y1="280.00" x2="423.21" y2="408.56" stroke="#9ca3af" stroke-width="2"/>
  <line x1="457.94" y1="211.60" x2="304.73" y2="83.04" stroke="#374151" stroke-width="3.5"/>
  <text x="414.73" y="113.51" font-size="17" fill="#111827" text-anchor="middle">1</text>
  <line x1="304.73" y1="83.04" x2="116.79" y2="151.44" stroke="#374151" stroke-width="3.5"/>
  <text x="192.99" y="74.41" font-size="17" fill="#111827" text-anchor="middle">1</text>
  <line x1="116.79" y1="151.44" x2="82.06" y2="348.40" stroke="#374151" stroke-width="3.5"/>
  <text x="48.25" y="246.90" font-size="17" fill="#111827" text-anchor="middle">1</text>
  <line x1="82.06" y1="348.40" x2="235.27" y2="476.96" stroke="#374151" stroke-width="3.5"/>
  <text x="125.27" y="458.49" font-size="17" fill="#111827" text-anchor="middle">1</text>
  <line x1="235.27" y1="476.96" x2="423.21" y2="408.56" stroke="#374151" stroke-width="3.5"/>
  <text x="347.01" y="497.59" font-size="17" fill="#111827" text-anchor="middle">1</text>
  <line x1="423.21" y1="408.56" x2="457.94" y2="211.60" stroke="#374151" stroke-width="3.5"/>
  <text x="491.75" y="325.10" font-size="17" fill="#111827" text-anchor="middle">1</text>
  <path d="M 322.62 260.85 A 56.00000000000001 56.00000000000001 0 0 0 279.72 224.85" fill="none" stroke="#b45309" stroke-width="2.5"/>
  <text x="323.99" y="221.65" font-size="17" fill="#b45309" text-anchor="middle">60°</text>
  <circle cx="457.94" cy="211.60" r="16" fill="#2563eb" stroke="#111827" stroke-width="2"/>
  <text x="457.94" y="217.60" font-size="16" font-weight="bold" fill="#ffffff" text-anchor="middle">2</text>
  <circle cx="304.73" cy="83.04" r="16" fill="#f59e0b" stroke="#111827" stroke-width="2"/>
  <text x="304.73" y="89.04" font-size="16" font-weight="bold" fill="#111827" text-anchor="middle">3</text>
  <circle cx="116.79" cy="151.44" r="16" fill="#2563eb" stroke="#111827" stroke-width="2"/>
  <text x="116.79" y="157.44" font-size="16" font-weight="bold" fill="#ffffff" text-anchor="middle">2</text>
  <circle cx="82.06" cy="348.40" r="16" fill="#f59e0b" stroke="#111827" stroke-width="2"/>
  <text x="82.06" y="354.40" font-size="16" font-weight="bold" fill="#111827" text-anchor="middle">3</text>
  <circle cx="235.27" cy="476.96" r="16" fill="#2563eb" stroke="#111827" stroke-width="2"/>
  <text x="235.27" y="482.96" font-size="16" font-weight="bold" fill="#ffffff" text-anchor="middle">2</text>
  <circle cx="423.21" cy="408.56" r="16" fill="#f59e0b" stroke="#111827" stroke-width="2"/>
  <text x="423.21" y="414.56" font-size="16" font-weight="bold" fill="#111827" text-anchor="middle">3</text>
  <circle cx="270.00" cy="280.00" r="16" fill="#dc2626" stroke="#111827" stroke-width="2"/>
  <text x="270.00" y="286.00" font-size="16" font-weight="bold" fill="#ffffff" text-anchor="middle">1</text>
  <text x="240.00" y="316.00" font-size="21" font-style="italic" fill="#111827">x</text>
  <text x="483.94" y="219.60" font-size="20" font-style="italic" fill="#111827">x + e</text>
  <text x="326.73" y="69.04" font-size="20" font-style="italic" fill="#111827">x + Re</text>
  <text x="540" y="70" font-size="23" font-weight="bold" fill="#111827">The sixty-degree rule</text>
  <text x="540" y="106" font-size="17" fill="#111827">Rotate a unit direction e by 60° (call the result Re).</text>
  <text x="540" y="136" font-size="17" fill="#111827">The points x, x + e and x + Re form an equilateral</text>
  <text x="540" y="166" font-size="17" fill="#111827">triangle with side 1 (shaded).</text>
  <text x="540" y="204" font-size="17" fill="#111827">So in a proper coloring:</text>
  <text x="540" y="234" font-size="17" fill="#111827">•  points 60° apart on the unit circle around x</text>
  <text x="560" y="264" font-size="17" fill="#111827">always get different colors, and</text>
  <text x="540" y="294" font-size="17" fill="#111827">•  no point on that circle has the color of x.</text>
  <text x="540" y="332" font-size="17" fill="#111827">Here two colors alternate around the circle.</text>
  <text x="540" y="362" font-size="17" fill="#111827">The paper proves a measure-theoretic version of</text>
  <text x="540" y="392" font-size="17" fill="#111827">this for its “palettes”: the colors seen in direction e</text>
  <text x="540" y="422" font-size="17" fill="#111827">and in direction Re never overlap (for almost every e).</text>
</svg>
