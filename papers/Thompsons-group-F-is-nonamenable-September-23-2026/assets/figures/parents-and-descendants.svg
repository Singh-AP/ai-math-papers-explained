  <text x="1028.0" y="332.0" font-size="12" fill="#28698D" text-anchor="end">3/4</text>
  <text x="885.0" y="278.0" font-size="12.5" fill="#28698D" text-anchor="middle">inside I<tspan baseline-shift='sub' font-size='10'>3</tspan> (magnified)</text>
  <rect x="60" y="420" width="980" height="190" rx="10" fill="#ffffff" stroke="#d3d2cd"/>
  <text x="85.0" y="454.0" font-size="15" fill="#0b0b0b" text-anchor="start" font-weight="bold">The colour of a basic dyadic partition T (a point of the unit ball B of a Hilbert space):</text>
  <text x="110.0" y="486.0" font-size="15" fill="#0b0b0b" text-anchor="start">p(T) = f( average of p(T<tspan baseline-shift='sub' font-size='10'>I1</tspan>), p(T<tspan baseline-shift='sub' font-size='10'>I2</tspan>), p(T<tspan baseline-shift='sub' font-size='10'>I3</tspan>) )   if T respects every parent;      p(T) = 0 otherwise.</text>
  <text x="110.0" y="512.0" font-size="13.5" fill="#52514e" text-anchor="start">T<tspan baseline-shift='sub' font-size='10'>I</tspan> = the cells of T inside I, stretched back to [0,1] (fewer cells, so the recursion stops).   f: B → B is Lipschitz and moves every point by at least δ.</text>
  <text x="85.0" y="546.0" font-size="15" fill="#0b0b0b" text-anchor="start" font-weight="bold">Seen from a group element g:</text>
  <text x="110.0" y="574.0" font-size="15" fill="#0b0b0b" text-anchor="start">parent colours X<tspan baseline-shift='sub' font-size='10'>i</tspan>,   descendant colours Y<tspan baseline-shift='sub' font-size='10'>ij</tspan>,   m = average of the X<tspan baseline-shift='sub' font-size='10'>i</tspan>,   z<tspan baseline-shift='sub' font-size='10'>i</tspan> = average over j of Y<tspan baseline-shift='sub' font-size='10'>ij</tspan>,   and exactly  X<tspan baseline-shift='sub' font-size='10'>i</tspan> = f(z<tspan baseline-shift='sub' font-size='10'>i</tspan>).</text>
  <text x="110.0" y="598.0" font-size="13.5" fill="#52514e" text-anchor="start">Because (T<tspan baseline-shift='sub' font-size='10'>I</tspan>)<tspan baseline-shift='sub' font-size='10'>J</tspan> = T<tspan baseline-shift='sub' font-size='10'>I·J</tspan>, the descendant colours Y<tspan baseline-shift='sub' font-size='10'>i1</tspan>, …, Y<tspan baseline-shift='sub' font-size='10'>iD</tspan> are exactly the inputs that f averages to produce X<tspan baseline-shift='sub' font-size='10'>i</tspan>.</text>
</svg>
