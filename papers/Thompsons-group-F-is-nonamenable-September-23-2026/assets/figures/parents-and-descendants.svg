<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 640" width="1100" height="640" font-family="Helvetica, Arial, sans-serif">
  <title>Parents, descendants and the recursive colour</title>
  <desc>Top: the unit interval with D = 3 parent intervals I1=[1/8,1/4], I2=[3/8,1/2], I3=[5/8,3/4]. Middle: each parent magnified, with its three descendants Ii·Ij, an affine copy of the parent pattern inside it. Bottom: the colour of a partition is f applied to the average of the colours of its normalized restrictions to the parents.</desc>
  <rect x="0" y="0" width="1100" height="640" fill="#fcfcfb"/>
  <text x="40.0" y="42.0" font-size="22" fill="#0b0b0b" text-anchor="start" font-weight="bold">Parents, descendants and the recursive colour (D = 3)</text>
  <text x="40.0" y="68.0" font-size="13.5" fill="#52514e" text-anchor="start">The proof fixes D separated dyadic intervals (parents) and puts an affine copy of the same pattern inside each one (descendants). Exact endpoints computed by script.</text>
