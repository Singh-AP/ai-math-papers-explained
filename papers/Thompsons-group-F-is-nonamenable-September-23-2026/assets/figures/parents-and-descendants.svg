  <text x="939.4" y="332.0" font-size="13" fill="#B76223" text-anchor="middle" font-weight="bold">I<tspan baseline-shift='sub' font-size='10'>3</tspan>·I<tspan baseline-shift='sub' font-size='10'>3</tspan></text>
  <text x="939.4" y="350.0" font-size="11.5" fill="#B76223" text-anchor="middle">[45/64,</text>
  <text x="939.4" y="364.0" font-size="11.5" fill="#B76223" text-anchor="middle">23/32]</text>
