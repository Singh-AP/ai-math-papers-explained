  <text x="235.0" y="278.0" font-size="12.5" fill="#28698D" text-anchor="middle">inside I<tspan baseline-shift='sub' font-size='10'>1</tspan> (magnified)</text>
  <line x1="432.5" y1="186" x2="415" y2="286" stroke="#28698D" stroke-width="1" stroke-dasharray="4 4"/>
