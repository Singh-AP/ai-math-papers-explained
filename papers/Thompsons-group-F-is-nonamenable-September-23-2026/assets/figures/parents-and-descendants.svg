  <text x="794.4" y="364.0" font-size="11.5" fill="#B76223" text-anchor="middle">21/32]</text>
  <rect x="848.8" y="290" width="36.2" height="20" fill="#f3dfcd" stroke="#B76223" stroke-width="2"/>
