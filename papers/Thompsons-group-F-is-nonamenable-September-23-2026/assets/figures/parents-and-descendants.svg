  <rect x="451.2" y="290" width="36.2" height="20" fill="#f3dfcd" stroke="#B76223" stroke-width="2"/>
  <text x="469.4" y="332.0" font-size="13" fill="#B76223" text-anchor="middle" font-weight="bold">I<tspan baseline-shift='sub' font-size='10'>2</tspan>·I<tspan baseline-shift='sub' font-size='10'>1</tspan></text>
  <text x="469.4" y="350.0" font-size="11.5" fill="#B76223" text-anchor="middle">[25/64,</text>
  <text x="469.4" y="364.0" font-size="11.5" fill="#B76223" text-anchor="middle">13/32]</text>
  <rect x="523.8" y="290" width="36.2" height="20" fill="#f3dfcd" stroke="#B76223" stroke-width="2"/>
  <text x="541.9" y="332.0" font-size="13" fill="#B76223" text-anchor="middle" font-weight="bold">I<tspan baseline-shift='sub' font-size='10'>2</tspan>·I<tspan baseline-shift='sub' font-size='10'>2</tspan></text>
  <text x="541.9" y="350.0" font-size="11.5" fill="#B76223" text-anchor="middle">[27/64,</text>
  <text x="541.9" y="364.0" font-size="11.5" fill="#B76223" text-anchor="middle">7/16]</text>
  <rect x="596.2" y="290" width="36.2" height="20" fill="#f3dfcd" stroke="#B76223" stroke-width="2"/>
  <text x="614.4" y="332.0" font-size="13" fill="#B76223" text-anchor="middle" font-weight="bold">I<tspan baseline-shift='sub' font-size='10'>2</tspan>·I<tspan baseline-shift='sub' font-size='10'>3</tspan></text>
  <text x="614.4" y="350.0" font-size="11.5" fill="#B76223" text-anchor="middle">[29/64,</text>
