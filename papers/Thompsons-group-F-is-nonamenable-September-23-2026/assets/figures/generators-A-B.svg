<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 590" width="1000" height="590" font-family="Helvetica, Arial, sans-serif">
  <title>The two standard generators A and B of Thompson's group F</title>
  <desc>Graphs of the piecewise-linear maps A and B on [0,1]. A has breakpoints at 1/2 and 3/4 with slopes 1/2, 1, 2. B is the identity on [0,1/2] and has breakpoints at 1/2, 3/4 and 7/8 with slopes 1, 1/2, 1, 2. Every breakpoint is a dyadic rational and every slope is a power of 2.</desc>
  <rect x="0" y="0" width="1000" height="590" fill="#fcfcfb"/>
  <text x="40.0" y="42.0" font-size="22" fill="#0b0b0b" text-anchor="start" font-weight="bold">The two standard generators of Thompson’s group F</text>
  <text x="40.0" y="68.0" font-size="13.5" fill="#52514e" text-anchor="start">Each is an increasing piecewise-linear bijection of [0,1] with dyadic breakpoints and slopes that are powers of 2.</text>
  <text x="40.0" y="88.0" font-size="13.5" fill="#52514e" text-anchor="start">Every element of F is a finite product of A, B and their inverses.</text>
