  <rect x="90" y="145" width="360" height="360" fill="none" stroke="#52514e" stroke-width="1.2"/>
  <line x1="90" y1="505" x2="450" y2="145" stroke="#a9a8a3" stroke-width="1.2" stroke-dasharray="5 5"/>
