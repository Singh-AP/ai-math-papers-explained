  <text x="760.0" y="131.0" font-size="18" fill="#0b0b0b" text-anchor="middle" font-weight="bold">B(x)</text>
  <text x="40.0" y="556.0" font-size="12.5" fill="#52514e" text-anchor="start">Dashed line: the identity map. Orange dots: breakpoints (x, g(x)). The paper multiplies by composition, hg = h∘g.</text>
  <text x="40.0" y="575.0" font-size="12.5" fill="#52514e" text-anchor="start">With that convention A and B satisfy the two relations of F’s finite presentation (checked with exact fractions by script).</text>
</svg>
