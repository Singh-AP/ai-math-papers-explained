<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 575" width="1000" height="575" font-family="Helvetica, Arial, sans-serif">
  <title>Boundary ratios: intervals in Z versus balls in the free group</title>
  <desc>Plot of |hA symmetric-difference A| / |A| for A the interval {-n..n} in the integers with h = +1, which tends to 0, and for A the ball of radius n in the free group on a, b with h = a, which tends to 1. The values were computed by script.</desc>
  <rect x="0" y="0" width="1000" height="575" fill="#fcfcfb"/>
  <text x="40.0" y="42.0" font-size="22" fill="#0b0b0b" text-anchor="start" font-weight="bold">How much does one translation move a finite set?</text>
  <text x="40.0" y="68.0" font-size="13.5" fill="#52514e" text-anchor="start">Boundary ratio #(hA △ A) / #A, where # counts elements and △ is the symmetric difference, computed exactly for n = 1, …, 8.</text>
  <text x="40.0" y="88.0" font-size="13.5" fill="#52514e" text-anchor="start">In an amenable group, some finite sets make this ratio as small as you like for any fixed finite list of translations h.</text>
  <line x1="110" y1="470.0" x2="670" y2="470.0" stroke="#e4e3df"/>
  <text x="100.0" y="474.0" font-size="13" fill="#52514e" text-anchor="end">0.0</text>
  <line x1="110" y1="414.6" x2="670" y2="414.6" stroke="#e4e3df"/>
  <text x="100.0" y="418.6" font-size="13" fill="#52514e" text-anchor="end">0.2</text>
  <line x1="110" y1="359.2" x2="670" y2="359.2" stroke="#e4e3df"/>
  <text x="100.0" y="363.2" font-size="13" fill="#52514e" text-anchor="end">0.4</text>
  <line x1="110" y1="303.8" x2="670" y2="303.8" stroke="#e4e3df"/>
  <text x="100.0" y="307.8" font-size="13" fill="#52514e" text-anchor="end">0.6</text>
  <line x1="110" y1="248.5" x2="670" y2="248.5" stroke="#e4e3df"/>
  <text x="100.0" y="252.5" font-size="13" fill="#52514e" text-anchor="end">0.8</text>
  <line x1="110" y1="193.1" x2="670" y2="193.1" stroke="#e4e3df"/>
  <text x="100.0" y="197.1" font-size="13" fill="#52514e" text-anchor="end">1.0</text>
  <line x1="110" y1="137.7" x2="670" y2="137.7" stroke="#e4e3df"/>
  <text x="100.0" y="141.7" font-size="13" fill="#52514e" text-anchor="end">1.2</text>
  <line x1="110" y1="470" x2="670" y2="470" stroke="#52514e" stroke-width="1.3"/>
  <line x1="110" y1="470" x2="110" y2="110" stroke="#52514e" stroke-width="1.3"/>
  <text x="142.9" y="490.0" font-size="13" fill="#52514e" text-anchor="middle">1</text>
  <text x="208.8" y="490.0" font-size="13" fill="#52514e" text-anchor="middle">2</text>
  <text x="274.7" y="490.0" font-size="13" fill="#52514e" text-anchor="middle">3</text>
  <text x="340.6" y="490.0" font-size="13" fill="#52514e" text-anchor="middle">4</text>
  <text x="406.5" y="490.0" font-size="13" fill="#52514e" text-anchor="middle">5</text>
  <text x="472.4" y="490.0" font-size="13" fill="#52514e" text-anchor="middle">6</text>
  <text x="538.2" y="490.0" font-size="13" fill="#52514e" text-anchor="middle">7</text>
  <text x="604.1" y="490.0" font-size="13" fill="#52514e" text-anchor="middle">8</text>
  <text x="390.0" y="514.0" font-size="13.5" fill="#52514e" text-anchor="middle">n (interval {−n, …, n} in Z; ball of radius n in the free group)</text>
  <text x="48" y="290.0" font-size="13.5" fill="#52514e" text-anchor="middle" transform="rotate(-90 48 290.0)">boundary ratio #(hA △ A) / #A</text>
  <polyline points="142.9,285.4 208.8,359.2 274.7,390.9 340.6,408.5 406.5,419.7 472.4,427.4 538.2,433.1 604.1,437.4" fill="none" stroke="#28698D" stroke-width="2.6"/>
  <circle cx="142.9" cy="285.4" r="4.5" fill="#28698D"/>
  <circle cx="208.8" cy="359.2" r="4.5" fill="#28698D"/>
  <circle cx="274.7" cy="390.9" r="4.5" fill="#28698D"/>
  <circle cx="340.6" cy="408.5" r="4.5" fill="#28698D"/>
  <circle cx="406.5" cy="419.7" r="4.5" fill="#28698D"/>
  <circle cx="472.4" cy="427.4" r="4.5" fill="#28698D"/>
  <circle cx="538.2" cy="433.1" r="4.5" fill="#28698D"/>
  <circle cx="604.1" cy="437.4" r="4.5" fill="#28698D"/>
  <polyline points="142.9,137.7 208.8,176.8 274.7,187.9 340.6,191.4 406.5,192.5 472.4,192.9 538.2,193.0 604.1,193.1" fill="none" stroke="#B76223" stroke-width="2.6"/>
  <circle cx="142.9" cy="137.7" r="4.5" fill="#B76223"/>
  <circle cx="208.8" cy="176.8" r="4.5" fill="#B76223"/>
  <circle cx="274.7" cy="187.9" r="4.5" fill="#B76223"/>
  <circle cx="340.6" cy="191.4" r="4.5" fill="#B76223"/>
  <circle cx="406.5" cy="192.5" r="4.5" fill="#B76223"/>
  <circle cx="472.4" cy="192.9" r="4.5" fill="#B76223"/>
  <circle cx="538.2" cy="193.0" r="4.5" fill="#B76223"/>
  <circle cx="604.1" cy="193.1" r="4.5" fill="#B76223"/>
  <text x="152.9" y="279.4" font-size="12.5" fill="#28698D" text-anchor="start">2/3</text>
  <text x="600.1" y="425.4" font-size="12.5" fill="#28698D" text-anchor="middle">2/17 ≈ 0.118</text>
  <text x="152.9" y="127.7" font-size="12.5" fill="#B76223" text-anchor="start">6/5</text>
  <text x="604.1" y="181.1" font-size="12.5" fill="#B76223" text-anchor="middle">13122/13121</text>
  <rect x="700" y="110" width="270" height="360" rx="10" fill="#ffffff" stroke="#d3d2cd"/>
  <circle cx="722" cy="140" r="6" fill="#28698D"/>
  <text x="736.0" y="145.0" font-size="14.5" fill="#28698D" text-anchor="start" font-weight="bold">Integers Z, h = +1</text>
  <text x="720.0" y="168.0" font-size="12.5" fill="#52514e" text-anchor="start">A = {−n, …, n}: only the two ends</text>
  <text x="720.0" y="187.0" font-size="12.5" fill="#52514e" text-anchor="start">move, so the ratio is 2/(2n+1) → 0.</text>
  <text x="720.0" y="206.0" font-size="12.5" fill="#52514e" text-anchor="start">Long intervals are Følner sets:</text>
  <text x="720.0" y="225.0" font-size="12.5" fill="#52514e" text-anchor="start">Z is amenable.</text>
  <circle cx="722" cy="268" r="6" fill="#B76223"/>
  <text x="736.0" y="273.0" font-size="14.5" fill="#B76223" text-anchor="start" font-weight="bold">Free group on a, b, h = a</text>
  <text x="720.0" y="296.0" font-size="12.5" fill="#52514e" text-anchor="start">A = ball of radius n: 2·3ⁿ − 1 words.</text>
  <text x="720.0" y="315.0" font-size="12.5" fill="#52514e" text-anchor="start">Left-multiplying by a pushes 3ⁿ</text>
  <text x="720.0" y="334.0" font-size="12.5" fill="#52514e" text-anchor="start">words out and 3ⁿ new ones in:</text>
  <text x="720.0" y="353.0" font-size="12.5" fill="#52514e" text-anchor="start">ratio 2·3ⁿ/(2·3ⁿ − 1) → 1.</text>
  <text x="720.0" y="372.0" font-size="12.5" fill="#52514e" text-anchor="start">The free group is not amenable.</text>
  <text x="720.0" y="410.0" font-size="13.5" fill="#0b0b0b" text-anchor="start" font-weight="bold">Thompson’s F (this paper):</text>
  <text x="720.0" y="432.0" font-size="12.5" fill="#52514e" text-anchor="start">for one fixed finite set S, every finite</text>
  <text x="720.0" y="451.0" font-size="12.5" fill="#52514e" text-anchor="start">A has max over h∈S of the ratio ≥ c > 0.</text>
  <text x="40.0" y="555.0" font-size="12.5" fill="#52514e" text-anchor="start">For the free group, balls are only examples; nonamenability means that no finite set at all has small ratios for both a and b at once.</text>
</svg>
