<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="860" viewBox="0 0 1200 860" font-family="Helvetica, Arial, sans-serif">
  <rect width="1200" height="860" fill="#ffffff"/>

  <!-- Title -->
  <text x="600" y="46" text-anchor="middle" font-size="28" font-weight="bold" fill="#1d1d1f">The Birch–Swinnerton-Dyer formula, piece by piece</text>
  <text x="600" y="76" text-anchor="middle" font-size="17" fill="#555">For an elliptic curve E over ℚ of rank r. This paper proves it whenever some Selmer corank of E is 0 or 1.</text>

  <!-- Formula: left fraction -->
  <g font-family="Times New Roman, Times, serif" font-size="34">
    <text x="225" y="150" text-anchor="middle" fill="#2f5fc4"><tspan font-style="italic">L</tspan><tspan dy="-14" font-size="22">(<tspan font-style="italic">r</tspan>)</tspan><tspan dy="14">(<tspan font-style="italic">E</tspan>, 1)</tspan></text>
    <line x1="140" y1="164" x2="310" y2="164" stroke="#2f5fc4" stroke-width="2"/>
    <text x="225" y="204" text-anchor="middle" fill="#2f5fc4"><tspan font-style="italic">r</tspan> !</text>

    <text x="395" y="176" text-anchor="middle" fill="#1d1d1f">=</text>

    <!-- Right fraction numerator -->
    <text x="790" y="150" text-anchor="middle" xml:space="preserve"><tspan fill="#2e8b57">Ω<tspan dy="8" font-size="22" font-style="italic">E</tspan></tspan><tspan dy="-8" fill="#1d1d1f"> · </tspan><tspan fill="#d9822b">Reg<tspan dy="8" font-size="22" font-style="italic">E</tspan></tspan><tspan dy="-8" fill="#1d1d1f"> · </tspan><tspan fill="#c0392b">#Ш(<tspan font-style="italic">E</tspan>)</tspan><tspan fill="#1d1d1f"> · </tspan><tspan fill="#7d3c98">∏ <tspan font-style="italic">c</tspan><tspan dy="8" font-size="22" font-style="italic">ℓ</tspan></tspan></text>
    <line x1="470" y1="164" x2="1110" y2="164" stroke="#1d1d1f" stroke-width="2"/>
    <text x="790" y="206" text-anchor="middle" fill="#138d90">( #<tspan font-style="italic">E</tspan>(ℚ)<tspan dy="8" font-size="22">tors</tspan><tspan dy="-8"> )</tspan><tspan dy="-14" font-size="22">2</tspan></text>
  </g>

  <!-- Analytic side box -->
  <rect x="40" y="250" width="360" height="320" rx="10" fill="#eef3fd" stroke="#2f5fc4" stroke-width="2.5"/>
  <text x="60" y="284" font-size="20" font-weight="bold" fill="#2f5fc4">Analytic side</text>
  <g font-size="16" fill="#1d1d1f">
    <text x="60" y="316">The L-function L(E, s) is built by</text>
    <text x="60" y="338">counting solutions of the equation</text>
    <text x="60" y="360">of E modulo every prime p.</text>
    <text x="60" y="394">Its order of vanishing at the centre</text>
    <text x="60" y="416">s = 1 is the analytic rank.</text>
    <text x="60" y="450">The left side is the first Taylor</text>
    <text x="60" y="472">coefficient at s = 1 that is not zero.</text>
    <text x="60" y="506" fill="#555">Rank 0: the value L(E, 1).</text>
    <text x="60" y="528" fill="#555">Rank 1: the slope L′(E, 1).</text>
  </g>

  <!-- Right grid: row 1 -->
  <rect x="440" y="250" width="220" height="150" rx="10" fill="#edf7f1" stroke="#2e8b57" stroke-width="2.5"/>
  <text x="456" y="280" font-size="18" font-weight="bold" fill="#2e8b57">Ω  real period</text>
  <g font-size="14.5" fill="#1d1d1f">
    <text x="456" y="306">The "length" of the real</text>
    <text x="456" y="326">curve E(ℝ), measured with</text>
    <text x="456" y="346">its standard differential,</text>
    <text x="456" y="366">over all its real pieces.</text>
  </g>

  <rect x="680" y="250" width="220" height="150" rx="10" fill="#fdf3e8" stroke="#d9822b" stroke-width="2.5"/>
  <text x="696" y="280" font-size="18" font-weight="bold" fill="#d9822b">Reg  regulator</text>
  <g font-size="14.5" fill="#1d1d1f">
    <text x="696" y="306">How spread out the rational</text>
    <text x="696" y="326">points of infinite order are,</text>
    <text x="696" y="346">measured by their heights.</text>
    <text x="696" y="366">Equal to 1 when r = 0.</text>
  </g>

  <rect x="920" y="250" width="240" height="150" rx="10" fill="#fdeeee" stroke="#c0392b" stroke-width="2.5"/>
  <text x="936" y="280" font-size="18" font-weight="bold" fill="#c0392b">#Ш  Tate–Shafarevich</text>
  <g font-size="14.5" fill="#1d1d1f">
    <text x="936" y="306">Counts "phantom" solutions:</text>
    <text x="936" y="326">found modulo every prime</text>
    <text x="936" y="346">power and over ℝ, not over ℚ.</text>
    <text x="936" y="366" font-weight="bold">Not known to be finite</text>
    <text x="936" y="386" font-weight="bold">in general!</text>
  </g>

  <!-- Right grid: row 2 -->
  <rect x="440" y="420" width="220" height="150" rx="10" fill="#f5eef9" stroke="#7d3c98" stroke-width="2.5"/>
  <text x="456" y="450" font-size="18" font-weight="bold" fill="#7d3c98" xml:space="preserve">∏ c<tspan dy="5" font-size="13">ℓ</tspan><tspan dy="-5">  Tamagawa</tspan></text>
  <g font-size="14.5" fill="#1d1d1f">
    <text x="456" y="476">Small correction factors,</text>
    <text x="456" y="496">one for each "bad" prime ℓ</text>
    <text x="456" y="516">where the curve degenerates</text>
    <text x="456" y="536">modulo ℓ.</text>
  </g>

  <rect x="680" y="420" width="220" height="150" rx="10" fill="#e9f6f6" stroke="#138d90" stroke-width="2.5"/>
  <text x="696" y="450" font-size="18" font-weight="bold" fill="#138d90" xml:space="preserve">#E(ℚ)<tspan dy="5" font-size="13">tors</tspan><tspan dy="-5">  torsion</tspan></text>
  <g font-size="14.5" fill="#1d1d1f">
    <text x="696" y="476">Rational points P with</text>
    <text x="696" y="496">nP = O for some n ≥ 1.</text>
    <text x="696" y="516">There are never more</text>
    <text x="696" y="536">than 16 of them.</text>
  </g>

  <rect x="920" y="420" width="240" height="150" rx="10" fill="#f3f3f5" stroke="#6b6b7b" stroke-width="2.5"/>
  <text x="936" y="450" font-size="18" font-weight="bold" fill="#4a4a5a">r  rank</text>
  <g font-size="14.5" fill="#1d1d1f">
    <text x="936" y="476">How many independent</text>
    <text x="936" y="496">rational points of infinite</text>
    <text x="936" y="516">order there are. BSD also</text>
    <text x="936" y="536">says r = analytic rank.</text>
  </g>

  <text x="600" y="600" text-anchor="middle" font-size="15" fill="#555" font-style="italic">Left: analysis (a function of a complex variable). Right: arithmetic (rational points and groups). The conjecture says they match exactly.</text>

  <!-- Bottom band -->
  <rect x="40" y="620" width="1120" height="220" rx="12" fill="#fafafa" stroke="#bbbbbb" stroke-width="1.5"/>
  <text x="60" y="652" font-size="20" font-weight="bold" fill="#1d1d1f">How the proof is organised: one prime at a time</text>
  <text x="60" y="680" font-size="15.5" fill="#1d1d1f" xml:space="preserve">Divide the left side by every factor on the right except #Ш, and call the result Q<tspan dy="5" font-size="12">E</tspan><tspan dy="-5">. The formula says exactly Q</tspan><tspan dy="5" font-size="12">E</tspan><tspan dy="-5"> = #Ш(E).</tspan></text>
  <text x="60" y="702" font-size="15.5" fill="#1d1d1f">Both are positive rational numbers, so it is enough to show that every prime p occurs to the same power in both.</text>

  <!-- Chips -->
  <rect x="60" y="722" width="300" height="98" rx="8" fill="#ffffff" stroke="#8a8a8a" stroke-width="1.5"/>
  <text x="76" y="748" font-size="15" font-weight="bold" fill="#1d1d1f" xml:space="preserve">Rank = analytic rank = s<tspan dy="5" font-size="11">q</tspan><tspan dy="-5"> ∈ {0, 1},</tspan></text>
  <text x="76" y="768" font-size="15" font-weight="bold" fill="#1d1d1f">and Ш is finite</text>
  <text x="76" y="792" font-size="13" fill="#555">Companion: the Selmer converse</text>
  <text x="76" y="810" font-size="13" fill="#555">at every prime (24 Sep 2026)</text>

  <text x="372" y="778" font-size="26" fill="#8a8a8a">+</text>

  <rect x="394" y="722" width="250" height="98" rx="8" fill="#ffffff" stroke="#8a8a8a" stroke-width="1.5"/>
  <text x="410" y="748" font-size="15" font-weight="bold" fill="#1d1d1f">The power of 2 matches</text>
  <text x="410" y="792" font-size="13" fill="#555">Companion: the two-primary</text>
  <text x="410" y="810" font-size="13" fill="#555">formula (24 Sep 2026)</text>

  <text x="656" y="778" font-size="26" fill="#8a8a8a">+</text>

  <rect x="678" y="722" width="270" height="98" rx="8" fill="#fff6d6" stroke="#c9a227" stroke-width="2.5"/>
  <text x="694" y="748" font-size="15" font-weight="bold" fill="#1d1d1f">The power of every odd</text>
  <text x="694" y="768" font-size="15" font-weight="bold" fill="#1d1d1f">prime 3, 5, 7, … matches</text>
  <text x="694" y="800" font-size="14" font-weight="bold" fill="#9a7a10">THIS PAPER (3 Oct 2026)</text>

  <text x="960" y="778" font-size="26" fill="#1d1d1f">⇒</text>

  <rect x="994" y="722" width="150" height="98" rx="8" fill="#e9f7ee" stroke="#2e8b57" stroke-width="2.5"/>
  <text x="1069" y="762" text-anchor="middle" font-size="17" font-weight="bold" fill="#1d1d1f" xml:space="preserve">Q<tspan dy="5" font-size="12">E</tspan><tspan dy="-5"> / #Ш = 1</tspan></text>
  <text x="1069" y="790" text-anchor="middle" font-size="13.5" fill="#2e8b57">the full formula</text>
</svg>
