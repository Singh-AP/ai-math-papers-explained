  <g font-size="13">
    <text x="952" y="484.0" fill="#111827" text-anchor="end" font-weight="bold">e = 2: Dirichlet — every irrational number has infinitely many fractions at least this good</text>
    <text x="952" y="343.5" fill="#b45309" text-anchor="end" font-weight="bold">e = 5/2: Flint–Hills threshold (μ(π) &lt; 5/2 is enough for convergence)</text>
  </g>
  <rect x="470" y="122" width="470" height="112" rx="8" fill="#ffffff" stroke="#059669" stroke-width="1.5"/>
  <g font-size="14">
    <text x="484" y="146" fill="#047857" font-weight="bold">This paper: μ(π) = 2</text>
    <text x="484" y="168" fill="#111827">For every line drawn above 2 (at 2.1, at 2.01, …), only finitely</text>
    <text x="484" y="186" fill="#111827">many dots lie above it. In the long run the dots must sink</text>
    <text x="484" y="204" fill="#111827">into every thin band just above the line e = 2.</text>
    <text x="484" y="224" fill="#6b7280" font-size="12">Before: only "finitely many above 7.103…" was known (Zeilberger–Zudilin, 2020).</text>
  </g>
  <text x="96" y="580" font-size="12" fill="#6b7280">A picture is not a proof: no finite list of dots can show μ(π) = 2. The theorem is about what happens forever, and its threshold is not explicit.</text>
</svg>
