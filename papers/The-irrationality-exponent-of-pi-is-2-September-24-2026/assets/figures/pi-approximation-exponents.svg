    <text x="750.5" y="522">10²⁵</text>
    <text x="881.5" y="522">10³⁰</text>
  </g>
  <text x="528" y="548" font-size="15" fill="#111827" text-anchor="middle">denominator q (log scale)</text>
  <text transform="translate(28 302) rotate(-90)" font-size="15" fill="#111827" text-anchor="middle">exponent e, where error = q^(−e)</text>
