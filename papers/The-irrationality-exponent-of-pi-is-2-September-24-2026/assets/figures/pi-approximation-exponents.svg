  <line x1="750.5" y1="104" x2="750.5" y2="500" stroke="#f3f4f6" stroke-width="1"/>
  <line x1="881.5" y1="104" x2="881.5" y2="500" stroke="#f3f4f6" stroke-width="1"/>
  <rect x="96" y="104" width="864" height="396" fill="none" stroke="#9ca3af" stroke-width="1"/>
  <line x1="96" y1="464.0" x2="960" y2="464.0" stroke="#111827" stroke-width="2.5"/>
  <line x1="96" y1="351.5" x2="960" y2="351.5" stroke="#d97706" stroke-width="2" stroke-dasharray="8 6"/>
  <g font-size="14" fill="#111827" text-anchor="end">
    <text x="88" y="469.0">2</text>
    <text x="88" y="356.5">5/2</text>
    <text x="88" y="244.0">3</text>
    <text x="88" y="131.5">3.5</text>
  </g>
