<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 600" width="1000" height="600" font-family="Helvetica, Arial, sans-serif">
  <title>How good are the best fractions for pi?</title>
  <desc>For each continued-fraction convergent p/q of pi (q from 7 to about 10^32), the exponent e with |pi - p/q| = q^(-e). All dots lie above 2. 22/7 and 355/113 stand out at small q; later dots crowd toward 2. Reference lines at 2 (Dirichlet) and 5/2 (Flint-Hills threshold).</desc>
  <rect x="0" y="0" width="1000" height="600" fill="#ffffff"/>
  <text x="96" y="38" font-size="22" font-weight="bold" fill="#111827">How good are the best fractions for π?</text>
  <text x="96" y="62" font-size="14" fill="#374151">Each dot is a continued-fraction convergent p/q of π. Its height is the exponent e in <tspan font-family="Georgia, Times New Roman, serif">|</tspan>π − p/q<tspan font-family="Georgia, Times New Roman, serif">|</tspan> = q^(−e):</text>
  <text x="96" y="80" font-size="14" fill="#374151">higher means "unusually close for the size of its denominator". First 61 convergents, computed with mpmath.</text>
  <line x1="96" y1="239.0" x2="960" y2="239.0" stroke="#e5e7eb" stroke-width="1"/>
  <line x1="96" y1="126.5" x2="960" y2="126.5" stroke="#e5e7eb" stroke-width="1"/>
  <line x1="226.9" y1="104" x2="226.9" y2="500" stroke="#f3f4f6" stroke-width="1"/>
  <line x1="357.8" y1="104" x2="357.8" y2="500" stroke="#f3f4f6" stroke-width="1"/>
