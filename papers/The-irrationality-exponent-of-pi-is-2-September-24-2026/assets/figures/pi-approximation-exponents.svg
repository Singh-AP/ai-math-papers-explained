    <text x="130.1" y="138.4" fill="#b91c1c" font-weight="bold">22/7</text>
    <text x="130.1" y="155.4" fill="#374151" font-size="12">e ≈ 3.43</text>
    <text x="161.8" y="189.6" fill="#b91c1c" font-weight="bold">355/113</text>
    <text x="161.8" y="206.6" fill="#374151" font-size="12">e ≈ 3.20 (next partial quotient: 292)</text>
    <line x1="353.3" y1="412.8" x2="383.3" y2="377.8" stroke="#6b7280" stroke-width="1"/>
    <text x="386.3" y="374.8" fill="#374151" font-size="12">next partial quotient 84</text>
