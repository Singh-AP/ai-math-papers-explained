<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 650" width="1100" height="650" font-family="Helvetica, Arial, sans-serif">
  <title>Best proven upper bound on the matrix multiplication exponent, 1969 to 2026</title>
  <desc>Step chart of the record upper bound on omega. Blue: earlier records from Strassen 1969 (2.8074) to Dupont et al. 2026 (2.371177), taken from the Wikipedia timeline. Orange: the openai/math family 107 preprints of September and October 2026: omega below 2.371054886 over every field, below 2.258 in characteristic zero, and at most 9/4 = 2.25 over the complex numbers. The last two orange markers are dodged horizontally because their dates are 8 days apart. The dashed line at omega = 2 is the trivial lower bound.</desc>
  <rect x="0" y="0" width="1100" height="650" fill="#fcfcfb"/>
  <text x="90" y="42" font-size="22" font-weight="bold" fill="#0b0b0b">The best proven upper bound on ω, 1969–2026</text>
  <text x="90" y="68" font-size="14" fill="#52514e">Multiplying two n×n matrices takes about n^ω operations. Lower is faster. Each step is a new record.</text>
  <text x="90" y="88" font-size="14" fill="#52514e">Orange: openai/math family 107 preprints (not yet peer reviewed). Blue: earlier records from the literature.</text>
  <line x1="90" y1="560.0" x2="1060" y2="560.0" stroke="#e4e3df" stroke-width="1"/>
  <text x="80" y="565.0" font-size="14" fill="#52514e" text-anchor="end">2.0</text>
  <line x1="90" y1="472.0" x2="1060" y2="472.0" stroke="#e4e3df" stroke-width="1"/>
  <text x="80" y="477.0" font-size="14" fill="#52514e" text-anchor="end">2.2</text>
  <line x1="90" y1="384.0" x2="1060" y2="384.0" stroke="#e4e3df" stroke-width="1"/>
  <text x="80" y="389.0" font-size="14" fill="#52514e" text-anchor="end">2.4</text>
  <line x1="90" y1="296.0" x2="1060" y2="296.0" stroke="#e4e3df" stroke-width="1"/>
  <text x="80" y="301.0" font-size="14" fill="#52514e" text-anchor="end">2.6</text>
  <line x1="90" y1="208.0" x2="1060" y2="208.0" stroke="#e4e3df" stroke-width="1"/>
  <text x="80" y="213.0" font-size="14" fill="#52514e" text-anchor="end">2.8</text>
  <line x1="90" y1="120.0" x2="1060" y2="120.0" stroke="#e4e3df" stroke-width="1"/>
  <text x="80" y="125.0" font-size="14" fill="#52514e" text-anchor="end">3.0</text>
  <line x1="152.6" y1="560" x2="152.6" y2="566" stroke="#8a8984" stroke-width="1"/>
  <text x="152.6" y="584" font-size="14" fill="#52514e" text-anchor="middle">1970</text>
  <line x1="309.0" y1="560" x2="309.0" y2="566" stroke="#8a8984" stroke-width="1"/>
  <text x="309.0" y="584" font-size="14" fill="#52514e" text-anchor="middle">1980</text>
  <line x1="465.5" y1="560" x2="465.5" y2="566" stroke="#8a8984" stroke-width="1"/>
  <text x="465.5" y="584" font-size="14" fill="#52514e" text-anchor="middle">1990</text>
  <line x1="621.9" y1="560" x2="621.9" y2="566" stroke="#8a8984" stroke-width="1"/>
  <text x="621.9" y="584" font-size="14" fill="#52514e" text-anchor="middle">2000</text>
  <line x1="778.4" y1="560" x2="778.4" y2="566" stroke="#8a8984" stroke-width="1"/>
  <text x="778.4" y="584" font-size="14" fill="#52514e" text-anchor="middle">2010</text>
  <line x1="934.8" y1="560" x2="934.8" y2="566" stroke="#8a8984" stroke-width="1"/>
  <text x="934.8" y="584" font-size="14" fill="#52514e" text-anchor="middle">2020</text>
  <line x1="90" y1="560" x2="1060" y2="560" stroke="#8a8984" stroke-width="1"/>
  <text x="575" y="612" font-size="14" fill="#52514e" text-anchor="middle">Year</text>
  <text x="28" y="340" font-size="14" fill="#52514e" text-anchor="middle" transform="rotate(-90 28 340)">Upper bound on ω</text>
  <line x1="90" y1="560.0" x2="1060" y2="560.0" stroke="#52514e" stroke-width="1.5" stroke-dasharray="6 5"/>
  <text x="100" y="550.0" font-size="13" fill="#52514e">ω ≥ 2: every algorithm must at least read all 2n² inputs. Most researchers expect ω = 2 (still open).</text>
  <text x="100" y="140.0" font-size="13" fill="#52514e">ω = 3: the schoolbook algorithm (n³ multiplications)</text>
