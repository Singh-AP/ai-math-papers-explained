  <text x="138.9" y="190.7" font-size="13" fill="#0b0b0b" text-anchor="start" font-weight="normal">Strassen 1969: 2.807 (7 products for 2×2)</text>
  <line x1="274.7" y1="214.8" x2="270.7" y2="222.8" stroke="#8a8984" stroke-width="1"/>
  <text x="269.7" y="235.8" font-size="13" fill="#0b0b0b" text-anchor="end" font-weight="normal">Pan 1978: 2.796</text>
  <line x1="290.4" y1="221.8" x2="286.4" y2="247.8" stroke="#8a8984" stroke-width="1"/>
  <text x="285.4" y="260.8" font-size="13" fill="#0b0b0b" text-anchor="end" font-weight="normal">Bini et al. 1979: 2.780</text>
  <text x="314.7" y="332.3" font-size="13" fill="#0b0b0b" text-anchor="end" font-weight="normal">Schönhage 1981: 2.522</text>
  <text x="314.7" y="363.8" font-size="13" fill="#0b0b0b" text-anchor="end" font-weight="normal">Coppersmith–Winograd 1981: 2.496</text>
  <text x="408.9" y="337.2" font-size="13" fill="#0b0b0b" text-anchor="start" font-weight="normal">Strassen 1986 (laser method): 2.479</text>
  <text x="471.5" y="420.8" font-size="13" fill="#0b0b0b" text-anchor="start" font-weight="normal">Coppersmith–Winograd 1990: 2.3755</text>
  <text x="471.5" y="438.8" font-size="13" fill="#52514e" text-anchor="start" font-weight="normal">then eight small records near 2.37,</text>
  <text x="471.5" y="456.8" font-size="13" fill="#52514e" text-anchor="start" font-weight="normal">ending with Dupont et al. 2026: 2.371177</text>
