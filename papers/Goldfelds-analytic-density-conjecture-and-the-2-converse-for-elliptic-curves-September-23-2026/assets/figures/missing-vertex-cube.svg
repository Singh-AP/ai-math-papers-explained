<svg xmlns="http://www.w3.org/2000/svg" width="1180" height="600" viewBox="0 0 1180 600" font-family="system-ui, -apple-system, Segoe UI, Helvetica, Arial, sans-serif">
<rect width="1180" height="600" fill="#fcfcfb"/>
<text x="30" y="40" font-size="21" fill="#0b0b0b" text-anchor="start" font-weight="600">The “missing vertex”: proving L(E, 1) ≠ 0 from a cube of twists</text>
<text x="30" y="66" font-size="14.5" fill="#52514e" text-anchor="start" font-weight="normal">Schematic with b = 3 and three new primes. The paper uses a large b, many primes and general linear forms λ_q(x).</text>
<line x1="150" y1="470" x2="380" y2="470" stroke="#c3c2b7" stroke-width="2"/>
<line x1="150" y1="470" x2="260" y2="375" stroke="#c3c2b7" stroke-width="2"/>
<line x1="150" y1="470" x2="150" y2="240" stroke="#c3c2b7" stroke-width="2"/>
<line x1="150" y1="240" x2="380" y2="240" stroke="#c3c2b7" stroke-width="2"/>
<line x1="150" y1="240" x2="260" y2="145" stroke="#c3c2b7" stroke-width="2"/>
<line x1="260" y1="375" x2="490" y2="375" stroke="#c3c2b7" stroke-width="2"/>
<line x1="260" y1="375" x2="260" y2="145" stroke="#c3c2b7" stroke-width="2"/>
<line x1="260" y1="145" x2="490" y2="145" stroke="#c3c2b7" stroke-width="2"/>
<line x1="380" y1="470" x2="490" y2="375" stroke="#c3c2b7" stroke-width="2"/>
<line x1="380" y1="470" x2="380" y2="240" stroke="#c3c2b7" stroke-width="2"/>
<line x1="380" y1="240" x2="490" y2="145" stroke="#c3c2b7" stroke-width="2"/>
<line x1="490" y1="375" x2="490" y2="145" stroke="#c3c2b7" stroke-width="2"/>
<circle cx="150" cy="470" r="22" fill="#fcfcfb" stroke="#eb6834" stroke-width="3"/>
<text x="150" y="477" font-size="20" fill="#0b0b0b" text-anchor="middle" font-weight="700">?</text>
<text x="120" y="516" font-size="13.5" fill="#0b0b0b" text-anchor="start" font-weight="600">x = 000:  h = 1, the curve E itself</text>
<text x="120" y="536" font-size="13.5" fill="#52514e" text-anchor="start" font-weight="normal">is L(E, 1) ≠ 0 ?</text>
<circle cx="150" cy="240" r="15" fill="#2a78d6"/>
<text x="150" y="245" font-size="14" fill="#ffffff" text-anchor="middle" font-weight="700">✓</text>
<text x="172" y="230" font-size="12.5" fill="#52514e" text-anchor="start" font-weight="normal" stroke="#fcfcfb" stroke-width="5" stroke-linejoin="round" paint-order="stroke">x = 001</text>
<text x="172" y="248" font-size="13.5" fill="#0b0b0b" text-anchor="start" font-weight="600" stroke="#fcfcfb" stroke-width="5" stroke-linejoin="round" paint-order="stroke">h = q₃*</text>
<circle cx="260" cy="375" r="15" fill="#2a78d6"/>
<text x="260" y="380" font-size="14" fill="#ffffff" text-anchor="middle" font-weight="700">✓</text>
<text x="282" y="365" font-size="12.5" fill="#52514e" text-anchor="start" font-weight="normal" stroke="#fcfcfb" stroke-width="5" stroke-linejoin="round" paint-order="stroke">x = 010</text>
<text x="282" y="383" font-size="13.5" fill="#0b0b0b" text-anchor="start" font-weight="600" stroke="#fcfcfb" stroke-width="5" stroke-linejoin="round" paint-order="stroke">h = q₂*</text>
<circle cx="260" cy="145" r="15" fill="#2a78d6"/>
<text x="260" y="150" font-size="14" fill="#ffffff" text-anchor="middle" font-weight="700">✓</text>
<text x="282" y="135" font-size="12.5" fill="#52514e" text-anchor="start" font-weight="normal" stroke="#fcfcfb" stroke-width="5" stroke-linejoin="round" paint-order="stroke">x = 011</text>
<text x="282" y="153" font-size="13.5" fill="#0b0b0b" text-anchor="start" font-weight="600" stroke="#fcfcfb" stroke-width="5" stroke-linejoin="round" paint-order="stroke">h = q₂*q₃*</text>
<circle cx="380" cy="470" r="15" fill="#2a78d6"/>
<text x="380" y="475" font-size="14" fill="#ffffff" text-anchor="middle" font-weight="700">✓</text>
<text x="402" y="460" font-size="12.5" fill="#52514e" text-anchor="start" font-weight="normal" stroke="#fcfcfb" stroke-width="5" stroke-linejoin="round" paint-order="stroke">x = 100</text>
<text x="402" y="478" font-size="13.5" fill="#0b0b0b" text-anchor="start" font-weight="600" stroke="#fcfcfb" stroke-width="5" stroke-linejoin="round" paint-order="stroke">h = q₁*</text>
<circle cx="380" cy="240" r="15" fill="#2a78d6"/>
<text x="380" y="245" font-size="14" fill="#ffffff" text-anchor="middle" font-weight="700">✓</text>
<text x="402" y="230" font-size="12.5" fill="#52514e" text-anchor="start" font-weight="normal" stroke="#fcfcfb" stroke-width="5" stroke-linejoin="round" paint-order="stroke">x = 101</text>
<text x="402" y="248" font-size="13.5" fill="#0b0b0b" text-anchor="start" font-weight="600" stroke="#fcfcfb" stroke-width="5" stroke-linejoin="round" paint-order="stroke">h = q₁*q₃*</text>
<circle cx="490" cy="375" r="15" fill="#2a78d6"/>
<text x="490" y="380" font-size="14" fill="#ffffff" text-anchor="middle" font-weight="700">✓</text>
<text x="512" y="365" font-size="12.5" fill="#52514e" text-anchor="start" font-weight="normal" stroke="#fcfcfb" stroke-width="5" stroke-linejoin="round" paint-order="stroke">x = 110</text>
<text x="512" y="383" font-size="13.5" fill="#0b0b0b" text-anchor="start" font-weight="600" stroke="#fcfcfb" stroke-width="5" stroke-linejoin="round" paint-order="stroke">h = q₁*q₂*</text>
<circle cx="490" cy="145" r="15" fill="#2a78d6"/>
<text x="490" y="150" font-size="14" fill="#ffffff" text-anchor="middle" font-weight="700">✓</text>
<text x="512" y="135" font-size="12.5" fill="#52514e" text-anchor="start" font-weight="normal" stroke="#fcfcfb" stroke-width="5" stroke-linejoin="round" paint-order="stroke">x = 111</text>
<text x="512" y="153" font-size="13.5" fill="#0b0b0b" text-anchor="start" font-weight="600" stroke="#fcfcfb" stroke-width="5" stroke-linejoin="round" paint-order="stroke">h = q₁*q₂*q₃*</text>
<text x="30" y="588" font-size="13" fill="#52514e" text-anchor="start" font-weight="normal">✓ = twist E⁽ʰ⁾ with L(E⁽ʰ⁾, 1) ≠ 0, its normalized value divisible by 2 at most B times (B does not grow with b).    q* = ±q, the sign chosen so that q* ≡ 1 (mod 4).</text>
<text x="640" y="120" font-size="15.5" fill="#0b0b0b" text-anchor="start" font-weight="600">1. Build a cube of twists.</text>
<text x="640" y="142" font-size="13.5" fill="#52514e" text-anchor="start" font-weight="normal">Pick new primes q and set h_x = ∏ (q*)^λ_q(x) for x in F₂ᵇ.</text>
<text x="640" y="162" font-size="13.5" fill="#52514e" text-anchor="start" font-weight="normal">Vertex 0 is E itself; the other 2ᵇ − 1 vertices are twists</text>
<text x="640" y="182" font-size="13.5" fill="#52514e" text-anchor="start" font-weight="normal">with the same local behaviour at 2 and the bad primes.</text>
<text x="640" y="218" font-size="15.5" fill="#0b0b0b" text-anchor="start" font-weight="600">2. Make every other vertex good.</text>
<text x="640" y="240" font-size="13.5" fill="#52514e" text-anchor="start" font-weight="normal">Choose the primes so that a coefficient test of a modular form</text>
<text x="640" y="260" font-size="13.5" fill="#52514e" text-anchor="start" font-weight="normal">certifies L(E⁽ʰˣ⁾, 1) ≠ 0 at every x ≠ 0, divisible by 2 at most B times.</text>
<text x="640" y="280" font-size="13.5" fill="#52514e" text-anchor="start" font-weight="normal">(Graphs of residue symbols, or Selmer matrices, do this.)</text>
<text x="640" y="316" font-size="15.5" fill="#0b0b0b" text-anchor="start" font-weight="600">3. One power series per vertex.</text>
<text x="640" y="338" font-size="13.5" fill="#52514e" text-anchor="start" font-weight="normal">Kato's class gives u_x(t) from one common Selmer complex;</text>
<text x="640" y="358" font-size="13.5" fill="#52514e" text-anchor="start" font-weight="normal">u_x(0) detects L(E⁽ʰˣ⁾, 1). Chevalley–Warning: for b large,</text>
<text x="640" y="378" font-size="13.5" fill="#52514e" text-anchor="start" font-weight="normal">some x ≠ 0 has u_x(0) ≡ u_0(0) modulo 2ᵐ.</text>
<text x="640" y="414" font-size="15.5" fill="#0b0b0b" text-anchor="start" font-weight="600">4. Conclude at the missing vertex.</text>
<text x="640" y="436" font-size="13.5" fill="#52514e" text-anchor="start" font-weight="normal">Take m bigger than the bound B. If u_0(0) were 0, that u_x(0)</text>
<text x="640" y="456" font-size="13.5" fill="#52514e" text-anchor="start" font-weight="normal">would be divisible by 2ᵐ, which is too much. So u_0(0) ≠ 0,</text>
<text x="640" y="476" font-size="13.5" fill="#52514e" text-anchor="start" font-weight="normal">and L(E, 1) ≠ 0. Rank 1 is the same, with a Heegner point.</text>
</svg>