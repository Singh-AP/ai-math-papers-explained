<circle cx='400.5' cy='442.1' r='17' fill='white' stroke='#2c5282' stroke-width='2.5'/><text x='400.5' y='448.1' font-family='Helvetica, Arial, sans-serif' font-size='17' text-anchor='middle' fill='#2c5282' font-weight='bold'>4</text>
<circle cx='444.1' cy='307.9' r='17' fill='white' stroke='#2c5282' stroke-width='2.5'/><text x='444.1' y='313.9' font-family='Helvetica, Arial, sans-serif' font-size='17' text-anchor='middle' fill='#2c5282' font-weight='bold'>5</text>
<circle cx='174.2' cy='130.6' r='17' fill='white' stroke='#9c4221' stroke-width='2.5'/><text x='174.2' y='136.6' font-family='Helvetica, Arial, sans-serif' font-size='17' text-anchor='middle' fill='#9c4221' font-weight='bold'>4</text>
<circle cx='78.0' cy='426.9' r='17' fill='white' stroke='#9c4221' stroke-width='2.5'/><text x='78.0' y='432.9' font-family='Helvetica, Arial, sans-serif' font-size='17' text-anchor='middle' fill='#9c4221' font-weight='bold'>5</text>
<circle cx='330.0' cy='610.0' r='17' fill='white' stroke='#9c4221' stroke-width='2.5'/><text x='330.0' y='616.0' font-family='Helvetica, Arial, sans-serif' font-size='17' text-anchor='middle' fill='#9c4221' font-weight='bold'>1</text>
<circle cx='582.0' cy='426.9' r='17' fill='white' stroke='#9c4221' stroke-width='2.5'/><text x='582.0' y='432.9' font-family='Helvetica, Arial, sans-serif' font-size='17' text-anchor='middle' fill='#9c4221' font-weight='bold'>2</text>
<circle cx='485.8' cy='130.6' r='17' fill='white' stroke='#9c4221' stroke-width='2.5'/><text x='485.8' y='136.6' font-family='Helvetica, Arial, sans-serif' font-size='17' text-anchor='middle' fill='#9c4221' font-weight='bold'>3</text>
<text x='330.0' y='660.0' font-family='Helvetica, Arial, sans-serif' font-size='15' text-anchor='middle' fill='#4a5568' font-weight='normal'>Glue the outer boundary to itself by the antipodal map:</text>
<text x='330.0' y='680.0' font-family='Helvetica, Arial, sans-serif' font-size='15' text-anchor='middle' fill='#4a5568' font-weight='normal'>reading anticlockwise from the top gives 1,4,2,5,3, 1,4,2,5,3: each outer edge appears twice.</text>
<text x='680.0' y='120.0' font-family='Helvetica, Arial, sans-serif' font-size='18' text-anchor='start' fill='#1a202c' font-weight='bold'>The two rules of Definition 5.1</text>
<text x='680.0' y='147.0' font-family='Helvetica, Arial, sans-serif' font-size='17' text-anchor='start' fill='#1a202c' font-weight='normal'>1. Of each complementary pair of triples, exactly</text>
<text x='680.0' y='174.0' font-family='Helvetica, Arial, sans-serif' font-size='17' text-anchor='start' fill='#1a202c' font-weight='normal'>&#160;&#160;&#160;one&#160;is&#160;a&#160;triangle:&#160;{0,1,2}&#160;is,&#160;{3,4,5}&#160;is&#160;not.</text>
<text x='680.0' y='201.0' font-family='Helvetica, Arial, sans-serif' font-size='17' text-anchor='start' fill='#1a202c' font-weight='normal'>2. Every pair of labels lies in exactly two triangles:</text>
<text x='680.0' y='228.0' font-family='Helvetica, Arial, sans-serif' font-size='17' text-anchor='start' fill='#1a202c' font-weight='normal'>&#160;&#160;&#160;{1,2}&#160;lies&#160;in&#160;{0,1,2}&#160;and&#160;{1,2,4}.</text>
<text x='680.0' y='282.0' font-family='Helvetica, Arial, sans-serif' font-size='18' text-anchor='start' fill='#1a202c' font-weight='bold'>Why it appears (Lemma 5.2)</text>
<text x='680.0' y='309.0' font-family='Helvetica, Arial, sans-serif' font-size='17' text-anchor='start' fill='#1a202c' font-weight='normal'>An admissible map on the lines of ℝ³ with six labels</text>
<text x='680.0' y='336.0' font-family='Helvetica, Arial, sans-serif' font-size='17' text-anchor='start' fill='#1a202c' font-weight='normal'>is forced to have exactly this kind of support pattern.</text>
<text x='680.0' y='363.0' font-family='Helvetica, Arial, sans-serif' font-size='17' text-anchor='start' fill='#1a202c' font-weight='normal'>In the ten-label proof, the six labels missing from</text>
<text x='680.0' y='390.0' font-family='Helvetica, Arial, sans-serif' font-size='17' text-anchor='start' fill='#1a202c' font-weight='normal'>each tetrahedron carry such a system (Lemma 6.1).</text>
<text x='680.0' y='444.0' font-family='Helvetica, Arial, sans-serif' font-size='18' text-anchor='start' fill='#744210' font-weight='bold'>Our own check (not in the paper)</text>
<text x='680.0' y='471.0' font-family='Helvetica, Arial, sans-serif' font-size='17' text-anchor='start' fill='#744210' font-weight='normal'>A brute-force search finds exactly 12 such systems,</text>
<text x='680.0' y='498.0' font-family='Helvetica, Arial, sans-serif' font-size='17' text-anchor='start' fill='#744210' font-weight='normal'>all relabellings of this one. It is the six-vertex</text>
<text x='680.0' y='525.0' font-family='Helvetica, Arial, sans-serif' font-size='17' text-anchor='start' fill='#744210' font-weight='normal'>triangulation of the projective plane</text>
<text x='680.0' y='552.0' font-family='Helvetica, Arial, sans-serif' font-size='17' text-anchor='start' fill='#744210' font-weight='normal'>(6 vertices − 15 edges + 10 triangles = 1).</text>
<rect x='666' y='94' width='508' height='473' fill='none' stroke='#e2e8f0' stroke-width='1.5' rx='8'/>
</svg>