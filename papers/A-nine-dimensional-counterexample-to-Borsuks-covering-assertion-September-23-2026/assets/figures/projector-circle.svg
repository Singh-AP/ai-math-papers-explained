<circle cx='270' cy='330' r='4' fill='#1a202c'/>
<text x='270.0' y='570.0' font-family='Helvetica, Arial, sans-serif' font-size='15' text-anchor='middle' fill='#4a5568' font-weight='normal'>Colour = piece: angle in [0°,60°), [60°,120°), [120°,180°)</text>
<text x='270.0' y='592.0' font-family='Helvetica, Arial, sans-serif' font-size='15' text-anchor='middle' fill='#c53030' font-weight='normal'>The 30° and 120° lines (thick) are perpendicular</text>
<defs><marker id='ah' markerUnits='userSpaceOnUse' markerWidth='16' markerHeight='16' refX='14' refY='8' orient='auto'><path d='M0,0 L16,8 L0,16 z' fill='#4a5568'/></marker></defs>
<line x1='505' y1='330' x2='625' y2='330' stroke='#4a5568' stroke-width='3' marker-end='url(#ah)'/>
<text x='565.0' y='290.0' font-family='Helvetica, Arial, sans-serif' font-size='19' text-anchor='middle' fill='#1a202c' font-weight='bold'>u → uuᵀ</text>
<text x='565.0' y='314.0' font-family='Helvetica, Arial, sans-serif' font-size='15' text-anchor='middle' fill='#4a5568' font-weight='normal'>angle θ → angle 2θ</text>
<text x='565.0' y='360.0' font-family='Helvetica, Arial, sans-serif' font-size='15' text-anchor='middle' fill='#4a5568' font-weight='normal'>dist = √2·|sin(θ−φ)|</text>
<text x='900.0' y='85.0' font-family='Helvetica, Arial, sans-serif' font-size='19' text-anchor='middle' fill='#1a202c' font-weight='bold'>Their projectors: a circle of radius 1/√2</text>
