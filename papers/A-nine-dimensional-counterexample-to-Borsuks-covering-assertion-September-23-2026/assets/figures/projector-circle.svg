<circle cx='805.0' cy='494.5' r='8' fill='#2f855a' stroke='white' stroke-width='2'/>
<text x='788.0' y='530.0' font-family='Helvetica, Arial, sans-serif' font-size='15' text-anchor='middle' fill='#2f855a' font-weight='bold'>120° line</text>
<circle cx='995.0' cy='494.5' r='8' fill='#2f855a' stroke='white' stroke-width='2'/>
<text x='1012.0' y='530.0' font-family='Helvetica, Arial, sans-serif' font-size='15' text-anchor='middle' fill='#2f855a' font-weight='bold'>150° line</text>
<line x1='995.0' y1='165.5' x2='805.0' y2='494.5' stroke='#c53030' stroke-width='3' stroke-dasharray='9,6'/>
<text x='848.0' y='374.0' font-family='Helvetica, Arial, sans-serif' font-size='17' text-anchor='end' fill='#c53030' font-weight='bold'>√2 ≈ 1.414</text>
<text x='848.0' y='394.0' font-family='Helvetica, Arial, sans-serif' font-size='14' text-anchor='end' fill='#c53030' font-weight='normal'>(the diameter)</text>
<line x1='1090.0' y1='330.0' x2='805.0' y2='165.5' stroke='#2b6cb0' stroke-width='2' stroke-dasharray='4,4'/>
<g transform='translate(1024.8,278.5) rotate(30.0)'><text x='0.0' y='0.0' font-family='Helvetica, Arial, sans-serif' font-size='15' text-anchor='middle' fill='#2b6cb0' font-weight='bold'>√1.5 ≈ 1.225</text></g>
<circle cx='900' cy='330' r='3' fill='#4a5568'/>
<text x='900.0' y='570.0' font-family='Helvetica, Arial, sans-serif' font-size='15' text-anchor='middle' fill='#4a5568' font-weight='normal'>Each coloured arc has diameter √1.5 &lt; √2, so 3 pieces suffice</text>
<text x='900.0' y='592.0' font-family='Helvetica, Arial, sans-serif' font-size='15' text-anchor='middle' fill='#c53030' font-weight='normal'>Perpendicular lines land at opposite points</text>
<text x='600.0' y='622.0' font-family='Helvetica, Arial, sans-serif' font-size='16' text-anchor='middle' fill='#1a202c' font-weight='normal' font-style='italic'>In ℝ⁴ the same map u → uuᵀ gives the paper's set X in ℝ⁹; there, ten pieces are not enough.</text>
</svg>